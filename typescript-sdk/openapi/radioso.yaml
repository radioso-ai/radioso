paths:
  /health:
    get:
      tags:
        - System
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new account
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Log in an existing account
      operationId: loginAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/invitations/{invitationToken}:
    get:
      tags:
        - Auth
      summary: Get invitation details for an account join flow
      operationId: getAccountInvitation
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: invitationToken
          in: path
      responses:
        "200":
          description: Invitation details returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDetailsResponse"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/invitations/{invitationToken}/accept:
    post:
      tags:
        - Auth
      summary: Accept an invitation and establish a session for the joined account
      operationId: acceptAccountInvitation
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: invitationToken
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptRequest"
      responses:
        "200":
          description: Invitation accepted and session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invitation email mismatch or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invitation is no longer valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/users:
    get:
      tags:
        - Account
      summary: List active account users and invitations
      operationId: listAccountUsers
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Account users returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUsersResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/accounts:
    get:
      tags:
        - Account
      summary: List accessible accounts for the current user
      operationId: listAccessibleAccounts
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Accessible accounts returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessibleAccountsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/invitations:
    post:
      tags:
        - Account
      summary: Create an account invitation
      operationId: createAccountInvitation
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInvitationCreateRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountInvitationResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invitation already pending or user already has access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/switch:
    post:
      tags:
        - Account
      summary: Switch the current session to another accessible account
      operationId: switchAccount
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  format: uuid
                preferredWorkspaceId:
                  type: string
                  format: uuid
              required:
                - accountId
      responses:
        "200":
          description: Account switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/users/{membershipId}:
    delete:
      tags:
        - Account
      summary: Remove account user access
      operationId: removeAccountUser
      security:
        - sessionCookie: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: membershipId
          in: path
      responses:
        "204":
          description: Account user removed
        "401":
          description: Authentication required
