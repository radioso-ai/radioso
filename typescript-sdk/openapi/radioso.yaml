      summary: Add an eval case to a dataset
      operationId: createEvalCase
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: datasetId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                sourceType:
                  type: string
                  enum:
                    - manual
                    - conversation_import
                query:
                  type: string
                  minLength: 1
                  maxLength: 2000
                conversationContext:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                        enum:
                          - user
                          - assistant
                          - system
                      content:
                        type: string
                        minLength: 1
                        maxLength: 2000
                    required:
                      - role
                      - content
                  maxItems: 12
                expectations:
                  type: object
                  properties:
                    expectedDocumentIds:
                      type: array
                      items:
                        type: string
                        format: uuid
                    expectedCitationTitles:
                      type: array
                      items:
                        type: string
                    expectedRefusalBehavior:
                      type: string
                      enum:
                        - refusal
                        - answer
                    expectedAnswerOutcome:
                      type: string
                      enum:
                        - grounded_success
                        - grounded_degraded_unsupported_segments
                        - no_context_refusal
                    requiredPhrases:
                      type: array
                      items:
                        type: string
                    forbiddenPhrases:
                      type: array
                      items:
                        type: string
                    latencyBudgetMs:
                      type: integer
                      exclusiveMinimum: 0
                provenance:
                  type: object
                  additionalProperties: {}
              required:
                - title
                - query
      responses:
        "201":
          description: Eval case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvalCase"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
