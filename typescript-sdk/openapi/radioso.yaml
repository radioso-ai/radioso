            - "null"
        proactiveGreetingEnabled:
          type: boolean
        assistantBootstrapActive:
          type: boolean
        websiteEmbedEnabled:
          type: boolean
        websiteEmbedToken:
          type:
            - string
            - "null"
        websiteEmbedScriptUrl:
