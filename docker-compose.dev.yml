  - ./package.json:/app/package.json:ro
  - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
  - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
  - ./frontend/app:/app/frontend/app
  - ./frontend/components:/app/frontend/components
  - ./frontend/docs:/app/frontend/docs
  - ./frontend/hooks:/app/frontend/hooks
