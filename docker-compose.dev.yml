  - ./packages/document-parser/index.d.ts:/app/packages/document-parser/index.d.ts:ro
  - ./packages/document-parser/index.js:/app/packages/document-parser/index.js:ro
  - ./packages/document-parser/parsers:/app/packages/document-parser/parsers
