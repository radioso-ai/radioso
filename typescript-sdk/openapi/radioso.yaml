              minLength: 1
            userExpectedLocale:
              type: string
              maxLength: 35
            inputMetadata:
              type: object
              properties:
                method:
                  type: string
                  enum:
                    - typed
                    - suggestion_click
                suggestionSourceMessageId:
                  type: string
                  format: uuid
              required:
                - method
            sourceContext:
              type: object
              properties:
                surface:
                  type: string
                  enum:
                    - authenticated_chat
                    - public_chat
                    - website_embed
                sourceOrigin:
                  type:
                    - string
                    - "null"
                  maxLength: 200
            metadataFilter:
              type: object
              additionalProperties: {}
          required:
            - startConversation
          additionalProperties: false
          description: Conversation bootstrap request. `conversationId` is not allowed and streaming is disabled.
    PublicChatRequest:
      anyOf:
        - type: object
          properties:
            conversationId:
              type: string
              format: uuid
            message:
              type: string
              minLength: 1
            startConversation:
              type: boolean
              enum:
                - false
              default: false
            stream:
              type: boolean
              default: false
            userExpectedLocale:
              type: string
              maxLength: 35
            inputMetadata:
              type: object
              properties:
                method:
                  type: string
                  enum:
                    - typed
                    - suggestion_click
                suggestionSourceMessageId:
                  type: string
                  format: uuid
              required:
                - method
          required:
            - message
          description: Standard public chat turn. `message` is required for non-bootstrap requests.
        - type: object
          properties:
            startConversation:
              type: boolean
              enum:
                - true
            stream:
              type: boolean
              enum:
                - false
              default: false
            message:
              type: string
              minLength: 1
            userExpectedLocale:
              type: string
              maxLength: 35
            inputMetadata:
              type: object
              properties:
                method:
                  type: string
                  enum:
                    - typed
                    - suggestion_click
                suggestionSourceMessageId:
                  type: string
                  format: uuid
              required:
                - method
          required:
            - startConversation
          additionalProperties: false
          description: Public conversation bootstrap request. `conversationId` is not allowed and streaming is disabled.
    ChatConversationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceChannel:
          type:
            - string
            - "null"
        sourceOrigin:
          type:
            - string
            - "null"
        anonymousSessionId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
          minimum: 0
        userMessageCount:
          type: integer
          minimum: 0
        assistantMessageCount:
          type: integer
          minimum: 0
        preview:
          type:
            - string
            - "null"
      required:
        - id
        - sourceChannel
        - sourceOrigin
        - anonymousSessionId
        - createdAt
        - updatedAt
        - messageCount
        - userMessageCount
        - assistantMessageCount
        - preview
    ChatHistoryListResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ChatConversationSummary"
        total:
          type: integer
          minimum: 0
        nextCursor:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
      required:
        - conversations
        - total
        - nextCursor
        - hasMore
    ValidationDisposition:
      type: string
      enum:
        - supported
        - unsupported
        - non_substantive
    ValidationSegmentResult:
      type: object
      properties:
        originalText:
          type: string
        text:
          type: string
        disposition:
          $ref: "#/components/schemas/ValidationDisposition"
        replacementApplied:
          type: boolean
        reason:
          type: string
        citationIndices:
          type: array
          items:
            type: integer
            minimum: 0
      required:
        - originalText
        - text
        - disposition
        - replacementApplied
        - reason
    ValidationDebug:
      type: object
      properties:
        ran:
          type: boolean
        answerModified:
          type: boolean
        unsupportedSegmentCount:
          type: integer
          minimum: 0
        substantiveUnsupportedSegmentCount:
          type: integer
          minimum: 0
        supportedSegmentCount:
          type: integer
          minimum: 0
        nonSubstantiveSegmentCount:
          type: integer
          minimum: 0
        hiddenSupportUsed:
          type: boolean
        hiddenSupportKindsUsed:
          type: array
          items:
            type: string
            enum:
              - assistant_name
              - assistant_role
        segmentResults:
          type: array
          items:
            $ref: "#/components/schemas/ValidationSegmentResult"
      required:
        - ran
        - answerModified
        - unsupportedSegmentCount
        - substantiveUnsupportedSegmentCount
        - supportedSegmentCount
        - nonSubstantiveSegmentCount
        - segmentResults
    ChatConversationMessageDebug:
      type: object
      properties:
        eventStatus:
          type: string
          enum:
            - success
            - failure
        recordedAt:
          type: string
          format: date-time
        stream:
          type: boolean
        citationCount:
          type: integer
          minimum: 0
        answerOutcome:
          type: string
          enum:
            - grounded_success
            - grounded_degraded_unsupported_segments
            - no_context_refusal
            - non_retrieval_response
        conversationMode:
          type: string
          enum: *a3
        route:
          $ref: "#/components/schemas/AssistantRouteDiagnostics"
        conversationModeMetadata:
          type: object
          properties:
            conversationMode:
              type: string
              enum: *a3
            brevityOverrideApplied:
              type: boolean
            expansionApplied:
              type: boolean
            expansionKind:
              type: string
              enum:
                - none
                - focused
                - expansive
            suggestionCount:
              type: integer
              minimum: 0
            followUpQuestionApplied:
              type: boolean
          required:
            - conversationMode
            - brevityOverrideApplied
            - expansionApplied
            - expansionKind
            - suggestionCount
            - followUpQuestionApplied
        validation:
          $ref: "#/components/schemas/ValidationDebug"
        retrievalInfo:
          $ref: "#/components/schemas/RetrievalInfo"
        retrievalTrace:
          $ref: "#/components/schemas/RetrievalTrace"
        errorMessage:
          type:
            - string
            - "null"
      required:
        - eventStatus
        - recordedAt
        - stream
        - citationCount
    ChatConversationMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - user
            - assistant
            - system
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        inputMetadata:
          type: object
          properties:
            method:
              type: string
              enum:
                - typed
                - suggestion_click
            suggestionSourceMessageId:
              type: string
              format: uuid
          required:
            - method
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        answerSegments:
          type: array
          items:
            $ref: "#/components/schemas/AnswerSegment"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/ChatSuggestion"
        debug:
          $ref: "#/components/schemas/ChatConversationMessageDebug"
      required:
        - id
        - role
        - content
        - createdAt
    ChatConversationDetail:
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        sourceChannel:
          type:
            - string
            - "null"
        sourceOrigin:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
          minimum: 0
        userMessageCount:
          type: integer
          minimum: 0
        assistantMessageCount:
          type: integer
          minimum: 0
        messagesTotal:
          type: integer
          minimum: 0
        messageWindowOffset:
          type: integer
          minimum: 0
        messageWindowLimit:
          type: integer
          minimum: 1
        hasOlderMessages:
          type: boolean
        nextCursor:
          type:
            - string
            - "null"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatConversationMessage"
      required:
        - conversationId
        - workspaceId
        - sourceChannel
        - sourceOrigin
        - createdAt
        - updatedAt
        - messageCount
        - userMessageCount
        - assistantMessageCount
        - messagesTotal
        - messageWindowOffset
        - messageWindowLimit
        - hasOlderMessages
        - nextCursor
        - messages
    PublicConversationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceChannel:
          type:
            - string
            - "null"
        preview:
          type:
            - string
            - "null"
        messageCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - sourceChannel
        - preview
        - messageCount
        - createdAt
        - updatedAt
    PublicConversationListResponse:
      type: object
      properties:
        workspaceName:
          type: string
        assistantBootstrapActive:
          type: boolean
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/PublicConversationSummary"
        total:
          type: integer
          minimum: 0
        nextCursor:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
      required:
        - workspaceName
        - assistantBootstrapActive
        - conversations
        - total
        - nextCursor
        - hasMore
    RateLimitExceededResponse:
      type: object
      properties:
        code:
          type: string
          enum:
            - rate_limit_exceeded
        message:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 1
      required:
        - code
        - message
        - retryAfterSeconds
    ConnectorField:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
        required:
          type: boolean
        defaultValue:
          type: string
        helpText:
          type: string
      required:
        - key
        - label
        - type
        - required
    ConnectorSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        errorStatus:
          type:
            - string
            - "null"
      required:
        - id
        - name
        - description
        - enabled
        - errorStatus
    ConnectorListResponse:
      type: object
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorSummary"
      required:
        - connectors
    ConnectorDetail:
      allOf:
        - $ref: "#/components/schemas/ConnectorSummary"
        - type: object
          properties:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/ConnectorField"
            config:
              type: object
              additionalProperties:
                anyOf:
                  - type: string
                  - type: number
                  - type: boolean
            webhookUrl:
              type: string
              format: uri
          required:
            - schema
            - config
            - webhookUrl
    ConnectorConfigUpdateRequest:
      type: object
      properties:
        config:
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: number
              - type: boolean
      required:
        - config
    ConnectorValidationIssue:
      type: object
      properties:
        key:
          type: string
        message:
          type: string
      required:
        - key
        - message
    ConnectorValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          enum:
            - Validation failed
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorValidationIssue"
      required:
        - error
        - fields
    ConnectorConflictResponse:
      type: object
      properties:
        error:
          type: string
          enum:
            - Channel identity conflict
        detail:
          type: string
      required:
        - error
        - detail
    AssistantChatSseStream:
      type: string
    ConnectorNotFoundResponse:
      type: object
      properties:
        error:
          type: string
          enum:
            - Connector not found
      required:
        - error
    PublicChatSseStream:
      type: string
  parameters: {}
paths:
  /health:
    get:
      tags:
        - System
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/public/embed/{token}/session:
    post:
      tags:
        - Assistant
      summary: Bootstrap an embedded chat session for an approved website origin
      operationId: createPublicEmbedSession
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: token
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicEmbedSessionRequest"
      responses:
        "200":
          description: Embedded chat session bootstrap returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicEmbedSessionResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Origin not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Embedded chat not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new account
      operationId: registerAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and verification required before sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Resource already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Log in an existing account
      operationId: loginAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Email verification required before sign-in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password-reset/request:
    post:
      tags:
        - Auth
      summary: Request a password reset email
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Password reset request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAcceptedResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many password reset requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Password reset delivery is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/email-verification/verify:
    post:
      tags:
        - Auth
      summary: Verify a user's email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationVerifyRequest"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailVerificationVerifiedResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Verification token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many verification attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/email-verification/resend:
    post:
      tags:
        - Auth
      summary: Resend an email verification link
      operationId: resendEmailVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailVerificationResendRequest"
      responses:
        "202":
          description: Verification resend accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetAcceptedResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many verification resend attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/password-reset/confirm:
    post:
      tags:
        - Auth
      summary: Confirm a password reset and establish a new session
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Password reset completed and session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetConfirmResponse"
        "400":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Password reset token is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many password reset attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/invitations/{invitationToken}:
    get:
      tags:
        - Auth
      summary: Get invitation details for an account join flow
      operationId: getAccountInvitation
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: invitationToken
          in: path
      responses:
        "200":
          description: Invitation details returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDetailsResponse"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/invitations/{invitationToken}/accept:
    post:
      tags:
        - Auth
      summary: Accept an invitation and establish a session for the joined account
      operationId: acceptAccountInvitation
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: invitationToken
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAcceptRequest"
      responses:
        "200":
          description: Invitation accepted and session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invitation email mismatch or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invitation is no longer valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/users:
    get:
      tags:
        - Account
      summary: List active account users and invitations
      operationId: listAccountUsers
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Account users returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUsersResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/accounts:
    get:
      tags:
        - Account
      summary: List accessible accounts for the current user
      operationId: listAccessibleAccounts
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Accessible accounts returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessibleAccountsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/invitations:
    post:
      tags:
        - Account
      summary: Create an account invitation
      operationId: createAccountInvitation
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInvitationCreateRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountInvitationResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Invitation already pending or user already has access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/switch:
    post:
      tags:
        - Account
      summary: Switch the current session to another accessible account
      operationId: switchAccount
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountId:
                  type: string
                  format: uuid
                preferredWorkspaceId:
                  type: string
                  format: uuid
              required:
                - accountId
      responses:
        "200":
          description: Account switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/users/{membershipId}:
    delete:
      tags:
        - Account
      summary: Remove account user access
      operationId: removeAccountUser
      security:
        - sessionCookie: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: membershipId
          in: path
      responses:
        "204":
          description: Account user removed
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Membership not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Membership cannot be removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/account/workspaces/{workspaceId}/token:
    get:
      tags:
        - Account
      summary: Reveal the workspace API token for manual SDK or CLI use
      operationId: getWorkspaceApiToken
      security:
        - sessionCookie: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: workspaceId
          in: path
      responses:
        "200":
          description: Workspace token returned
