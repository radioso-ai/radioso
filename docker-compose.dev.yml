  - radioso_pnpm_store:/pnpm/store

services:
  workspace-deps:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    restart: "no"
    volumes: *workspace-deps-volumes
    command: ["sh", "-lc", "pnpm install --force --frozen-lockfile && backend-dev-install-state.sh write"]

  backend:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    environment:
      NODE_ENV: development
      AUTH_AUTO_VERIFY_EMAIL: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      workspace-deps:
        condition: service_completed_successfully
    volumes: *backend-dev-volumes
    command: ["backend-dev-entrypoint.sh", "dev:http"]

  backend-worker:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes: *backend-dev-volumes
    command: ["backend-dev-entrypoint.sh", "dev:worker"]

  backend-crawler-worker:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes: *backend-dev-volumes
    command: ["backend-dev-entrypoint.sh", "dev:crawler-worker"]

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.dev.Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: development
      BACKEND_INTERNAL_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes: *frontend-dev-volumes

volumes:
  radioso_workspace_node_modules:
  radioso_backend_node_modules:
  radioso_crawler_node_modules:
  radioso_document_parser_node_modules:
  radioso_frontend_node_modules:
  radioso_ui_node_modules:
  radioso_frontend_next:
  # Persists the pnpm content-addressable store across boots so the runtime
  # dependency reinstall does not re-download packages on every `run-dev.sh`.
  radioso_pnpm_store:
