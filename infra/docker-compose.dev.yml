services:
  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      NODE_ENV: development
    command: ["npm", "run", "start:http"]

  backend-worker:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    environment:
      NODE_ENV: development
    depends_on:
      backend:
        condition: service_healthy
    command: ["npm", "run", "start:worker"]

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.dev.Dockerfile
    environment:
      NODE_ENV: development
      BACKEND_INTERNAL_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      - radioso_frontend_node_modules:/app/node_modules

volumes:
  radioso_frontend_node_modules:
