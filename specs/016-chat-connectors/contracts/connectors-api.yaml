openapi: 3.0.3
info:
  title: Chat Connectors API
  description: REST endpoints for managing chat connector plugins per workspace.
  version: 1.0.0

paths:
  /api/v1/connectors:
    get:
      summary: List all available connectors with per-workspace status
      description: Returns all registered connector plugins with their enabled/disabled state and error status for the current workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: List of connectors
          content:
            application/json:
              schema:
                type: object
                required: [connectors]
                properties:
                  connectors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConnectorSummary'
      security:
        - bearerAuth: []

  /api/v1/connectors/{connectorId}:
    get:
      summary: Get connector config schema and current workspace configuration
      description: Returns the connector's declared config schema and the current workspace's saved configuration values (with secrets masked).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          description: Connector detail with schema and config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDetail'
        '404':
          description: Connector not found
      security:
        - bearerAuth: []

    put:
      summary: Save connector configuration for a workspace
      description: Saves the configuration fields for a connector. Secret fields are encrypted before storage. Validates required fields if enabling.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConnectorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorConfigUpdate'
      responses:
        '200':
          description: Configuration saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDetail'
        '400':
          description: Validation error (missing required fields, invalid values)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Connector not found
        '409':
          description: Conflict — external channel identity already in use by another workspace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
      security:
        - bearerAuth: []

  /api/v1/connectors/{connectorId}/enable:
    post:
      summary: Enable a connector for a workspace
      description: Enables a previously configured connector. Validates that all required config fields are present. Initializes the connector's runtime (webhook routes, etc).
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          description: Connector enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDetail'
        '400':
          description: Missing required configuration fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: Connector not found
      security:
        - bearerAuth: []

  /api/v1/connectors/{connectorId}/disable:
    post:
      summary: Disable a connector for a workspace
      description: Disables an active connector. Stops processing incoming messages. Configuration is preserved for re-enabling later.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - $ref: '#/components/parameters/ConnectorId'
      responses:
        '200':
          description: Connector disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDetail'
        '404':
          description: Connector not found
      security:
        - bearerAuth: []

  /api/connectors/whatsapp/{workspaceId}/webhook:
    get:
      summary: WhatsApp webhook verification
      description: Handles Meta's webhook subscription verification. Validates the verify token and returns the challenge.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: hub.mode
          in: query
          required: true
          schema:
            type: string
            enum: [subscribe]
        - name: hub.verify_token
          in: query
          required: true
          schema:
            type: string
        - name: hub.challenge
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Challenge echoed back (plain text)
          content:
            text/plain:
              schema:
                type: string
        '403':
          description: Verify token mismatch
      security: []

    post:
      summary: WhatsApp webhook notifications
      description: Receives incoming message notifications from Meta. Verifies X-Hub-Signature-256, acknowledges with 200, processes asynchronously.
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppWebhookPayload'
      responses:
        '200':
          description: Acknowledged
        '401':
          description: Invalid or missing signature
      security: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    WorkspaceId:
      name: x-workspace-id
      in: header
      required: true
      description: The workspace ID (passed as header, consistent with existing API pattern)
      schema:
        type: string
        format: uuid
    ConnectorId:
      name: connectorId
      in: path
      required: true
      schema:
        type: string
        example: whatsapp

  schemas:
    ConnectorSummary:
      type: object
      required: [id, name, description, enabled, errorStatus]
      properties:
        id:
          type: string
          example: whatsapp
        name:
          type: string
          example: WhatsApp
        description:
          type: string
          example: Connect to WhatsApp Business API to receive and respond to messages.
        enabled:
          type: boolean
        errorStatus:
          type: string
          nullable: true
          example: null

    ConnectorDetail:
      type: object
      required: [id, name, description, enabled, errorStatus, schema, config, webhookUrl]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        errorStatus:
          type: string
          nullable: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ConfigField'
        config:
          type: object
          description: Current configuration values. Secret fields are masked (last 4 chars).
          additionalProperties:
            oneOf:
              - type: string
              - type: boolean
              - type: number
        webhookUrl:
          type: string
          nullable: true
          description: Auto-generated webhook URL (read-only). Null if not applicable.
          example: https://example.com/api/connectors/whatsapp/ws_123/webhook

    ConfigField:
      type: object
      required: [key, type, label, required]
      properties:
        key:
          type: string
          example: access_token
        type:
          type: string
          enum: [text, secret, toggle, select]
        label:
          type: string
          example: Access Token
        required:
          type: boolean
        placeholder:
          type: string
          nullable: true
        helpText:
          type: string
          nullable: true
        options:
          type: array
          nullable: true
          description: Only for 'select' type fields
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string

    ConnectorConfigUpdate:
      type: object
      required: [config]
      properties:
        config:
          type: object
          description: Key-value pairs matching the connector's schema field keys.
          additionalProperties:
            oneOf:
              - type: string
              - type: boolean
              - type: number

    ValidationError:
      type: object
      required: [error, fields]
      properties:
        error:
          type: string
          example: Validation failed
        fields:
          type: array
          items:
            type: object
            required: [key, message]
            properties:
              key:
                type: string
                example: access_token
              message:
                type: string
                example: Required field is missing

    ConflictError:
      type: object
      required: [error, detail]
      properties:
        error:
          type: string
          example: Channel identity conflict
        detail:
          type: string
          example: Phone number +14155551234 is already configured in another workspace.

    WhatsAppWebhookPayload:
      type: object
      description: Meta webhook notification payload (simplified schema — see Meta docs for full structure)
      required: [object, entry]
      properties:
        object:
          type: string
          enum: [whatsapp_business_account]
        entry:
          type: array
          items:
            type: object
            required: [id, changes]
            properties:
              id:
                type: string
              changes:
                type: array
                items:
                  type: object
                  required: [value, field]
                  properties:
                    field:
                      type: string
                      enum: [messages]
                    value:
                      type: object
                      properties:
                        messaging_product:
                          type: string
                          enum: [whatsapp]
                        metadata:
                          type: object
                          properties:
                            display_phone_number:
                              type: string
                            phone_number_id:
                              type: string
                        contacts:
                          type: array
                          items:
                            type: object
                            properties:
                              wa_id:
                                type: string
                              profile:
                                type: object
                                properties:
                                  name:
                                    type: string
                        messages:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              from:
                                type: string
                              timestamp:
                                type: string
                              type:
                                type: string
                              text:
                                type: object
                                properties:
                                  body:
                                    type: string
                        statuses:
                          type: array
                          description: Message delivery status updates (sent, delivered, read). Ignored by connector.
                          items:
                            type: object
