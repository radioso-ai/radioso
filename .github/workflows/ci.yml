name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - id: filter
        name: Detect CI-relevant changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          git fetch --no-tags --prune --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          run_ci=false
          while IFS= read -r path; do
            [ -n "$path" ] || continue

            case "$path" in
              .github/workflows/*|infra/*|.dockerignore|*/.dockerignore|Dockerfile|*/Dockerfile|*.Dockerfile)
                ;;
              *)
                run_ci=true
                break
                ;;
            esac
          done < <(git diff --name-only "origin/${BASE_REF}...HEAD")

          echo "run_ci=${run_ci}" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: radioso_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d radioso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/radioso_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter radioso-backend... --filter @radioso/crawler...

      - name: Lint backend module boundaries
        working-directory: backend
        run: pnpm run lint:boundaries

      - name: Build backend
        working-directory: backend
        run: pnpm run build

      - name: Test backend unit suite
        working-directory: backend
        run: pnpm run test:unit

      - name: Test backend integration suite
        working-directory: backend
        run: pnpm run test:integration

      - name: Test backend contracts
        working-directory: backend
        run: pnpm run test:contract

      - name: Upload backend OpenAPI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-openapi
          path: |
            backend/openapi.json
            backend/openapi.yaml
          if-no-files-found: error

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter radioso-frontend...

      - name: Lint frontend
        working-directory: frontend
        run: pnpm run lint

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Test frontend unit suite
        working-directory: frontend
        run: pnpm test

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Test frontend end-to-end suite
        working-directory: frontend
        run: pnpm run test:e2e

  docs-portal:
    name: Docs Portal
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend
    if: needs.changes.outputs.run_ci == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Download backend OpenAPI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backend-openapi
          path: backend

      - name: Install docs portal dependencies
        run: pnpm install --frozen-lockfile --filter radioso-docs-portal...

      - name: Lint docs portal
        working-directory: docs-portal
        run: pnpm run lint

      - name: Build docs portal
        working-directory: docs-portal
        run: pnpm run build

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend
    if: needs.changes.outputs.run_ci == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Download backend OpenAPI artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backend-openapi
          path: backend

      - name: Install TypeScript SDK dependencies
        run: pnpm install --frozen-lockfile --filter @radioso/typescript-sdk...

      - name: Build TypeScript SDK
        working-directory: typescript-sdk
        run: pnpm run build

      - name: Test TypeScript SDK
        working-directory: typescript-sdk
        run: pnpm test

  mcp-server:
    name: MCP Server
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RADIOSO_MCP_SMOKE_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter radioso-backend... --filter @radioso/mcp-server...

      - name: Build MCP server
        working-directory: packages/radioso-mcp-server
        run: pnpm run build

      - name: Test MCP server
        working-directory: packages/radioso-mcp-server
        run: pnpm test

      - name: Smoke test MCP server
        working-directory: packages/radioso-mcp-server
        run: pnpm run smoke:all

  crawler:
    name: Crawler Package
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install crawler dependencies
        run: pnpm install --frozen-lockfile --filter @radioso/crawler...

      - name: Build crawler
        working-directory: packages/crawler
        run: pnpm run build

      - name: Test crawler
        working-directory: packages/crawler
        run: pnpm test

  ee:
    name: Enterprise Edition
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install Enterprise Edition dependencies
        run: pnpm install --frozen-lockfile --filter './ee/packages/*...'

      - name: Build Enterprise Edition packages
        working-directory: ee
        run: pnpm run build

      - name: Test Enterprise Edition packages
        working-directory: ee
        run: pnpm test
