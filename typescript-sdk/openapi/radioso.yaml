                    field:
                      type: string
                    valueType:
                      type: string
                      enum: *a1
                    operator:
                      type: string
                      enum: *a2
                    value:
                      type: string
                  required:
                    - id
                    - field
                    - valueType
                    - operator
                    - value
                default: []
              effect:
                type: string
                enum: *a4
              enabled:
                type: boolean
              triggerMode:
                type: string
                enum: *a5
              triggerInstruction:
                type: string
            required:
              - id
              - field
              - valueType
              - operator
              - value
              - effect
              - enabled
