name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run.
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      environment:
        description: Deployment environment to target.
        required: true
        type: choice
        options:
          - staging
          - live
          - live-eu
      initial_backend_image:
        description: Existing backend image to use when the target Cloud Run services do not exist yet.
        required: false
        type: string
      initial_frontend_image:
        description: Existing frontend image to use when the target Cloud Run services do not exist yet.
        required: false
        type: string
      initial_worker_tasks_service_url:
        description: Stable HTTPS worker service URL to use when the target Cloud Run services do not exist yet.
        required: false
        type: string

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      CONNECTOR_PUBLIC_BASE_URL: ${{ vars.CONNECTOR_PUBLIC_BASE_URL }}
      PUBLIC_CHAT_BASE_URL: ${{ vars.PUBLIC_CHAT_BASE_URL }}
      RADIOSO_MCP_ENABLED: ${{ vars.RADIOSO_MCP_ENABLED }}
      OTEL_LOGS_ENABLED: ${{ vars.OTEL_LOGS_ENABLED }}
      OTEL_LOGS_MIN_LEVEL: ${{ vars.OTEL_LOGS_MIN_LEVEL }}
      TF_IN_AUTOMATION: true
      TF_VAR_connector_encryption_key: ${{ secrets.CONNECTOR_ENCRYPTION_KEY }}
      TF_VAR_mail_from_email: ${{ vars.MAIL_FROM_EMAIL }}
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_resend_mail_api_key: ${{ secrets.RESEND_MAIL_API_KEY }}
      TF_VAR_session_cookie_secret: ${{ secrets.SESSION_COOKIE_SECRET }}
      TF_VAR_public_chat_session_secret: ${{ secrets.PUBLIC_CHAT_SESSION_SECRET }}
      TF_VAR_workspace_token_secret: ${{ secrets.WORKSPACE_TOKEN_SECRET }}
      TF_VAR_slack_oauth_client_id: ${{ secrets.SLACK_OAUTH_CLIENT_ID }}
      TF_VAR_slack_oauth_client_secret: ${{ secrets.SLACK_OAUTH_CLIENT_SECRET }}
      TF_VAR_slack_signing_secret: ${{ secrets.SLACK_SIGNING_SECRET }}
      TF_VAR_ee_usage_admin_token: ${{ secrets.EE_USAGE_ADMIN_TOKEN }}

    steps:
      - name: Require configured GitHub environment variables
        run: |
          for key in \
            GCP_DEPLOY_SERVICE_ACCOUNT \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            TF_VAR_connector_encryption_key \
            TF_VAR_mail_from_email \
            TF_VAR_openai_api_key \
            TF_VAR_resend_mail_api_key \
            TF_VAR_session_cookie_secret \
            TF_VAR_public_chat_session_secret \
            TF_VAR_workspace_token_secret
          do
            if [ -z "${!key}" ]; then
              echo "Missing required GitHub environment value: $key" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd

      - name: Export optional Terraform variables
        env:
          ERROR_SINKS: ${{ vars.ERROR_SINKS }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          METRICS_AUTH_TOKEN: ${{ secrets.METRICS_AUTH_TOKEN }}
          MONITORING_ENABLED: ${{ vars.MONITORING_ENABLED }}
          MONITORING_EXTRA_NOTIFICATION_CHANNEL_IDS: ${{ vars.MONITORING_EXTRA_NOTIFICATION_CHANNEL_IDS }}
          MONITORING_NOTIFICATION_EMAILS: ${{ vars.MONITORING_NOTIFICATION_EMAILS }}
          OPS_EVENT_WEBHOOK_EVENTS: ${{ vars.OPS_EVENT_WEBHOOK_EVENTS }}
          OPS_EVENT_WEBHOOK_SECRET: ${{ secrets.OPS_EVENT_WEBHOOK_SECRET }}
          OPS_EVENT_WEBHOOK_URL: ${{ vars.OPS_EVENT_WEBHOOK_URL }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
          PRODUCT_ANALYTICS_SINKS: ${{ vars.PRODUCT_ANALYTICS_SINKS }}
        run: |
          # GitHub environment values are strings; monitoring_notification_emails and
          # monitoring_extra_notification_channel_ids are list(string). Accept a
          # comma-separated value and hand Terraform the JSON that TF_VAR_ parses.
          to_json_list() {
            jq --null-input --compact-output --arg raw "$1" \
              '$raw | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))'
          }

          if [ -n "${METRICS_AUTH_TOKEN}" ]; then
            echo "TF_VAR_metrics_auth_token=${METRICS_AUTH_TOKEN}" >> "$GITHUB_ENV"
          fi

          if [ -n "${MAIL_FROM_NAME}" ]; then
            echo "TF_VAR_mail_from_name=${MAIL_FROM_NAME}" >> "$GITHUB_ENV"
          fi

          # Alerting stays off until an environment opts in. Terraform's own precondition
          # refuses a plan that enables it with nowhere to deliver; failing here instead
          # names the GitHub value to set rather than the Terraform variable it feeds.
          if [ "${MONITORING_ENABLED}" = "true" ]; then
            MONITORING_EMAILS_JSON="$(to_json_list "${MONITORING_NOTIFICATION_EMAILS}")"
            MONITORING_CHANNELS_JSON="$(to_json_list "${MONITORING_EXTRA_NOTIFICATION_CHANNEL_IDS}")"

            if [ "${MONITORING_EMAILS_JSON}" = "[]" ] && [ "${MONITORING_CHANNELS_JSON}" = "[]" ]; then
              echo "Missing required GitHub environment value: MONITORING_NOTIFICATION_EMAILS or MONITORING_EXTRA_NOTIFICATION_CHANNEL_IDS because MONITORING_ENABLED is true" >&2
              exit 1
            fi

            echo "TF_VAR_monitoring_enabled=true" >> "$GITHUB_ENV"
            echo "TF_VAR_monitoring_notification_emails=${MONITORING_EMAILS_JSON}" >> "$GITHUB_ENV"
            echo "TF_VAR_monitoring_extra_notification_channel_ids=${MONITORING_CHANNELS_JSON}" >> "$GITHUB_ENV"
          fi

          if [ "${{ inputs.environment }}" = "staging" ] || [ "${{ inputs.environment }}" = "live" ] || [ "${{ inputs.environment }}" = "live-eu" ]; then
            if [ -n "${ERROR_SINKS}" ]; then
              echo "TF_VAR_error_sinks=${ERROR_SINKS}" >> "$GITHUB_ENV"
            fi

            if [ -n "${PRODUCT_ANALYTICS_SINKS}" ]; then
              echo "TF_VAR_product_analytics_sinks=${PRODUCT_ANALYTICS_SINKS}" >> "$GITHUB_ENV"
            fi

            if [ -n "${POSTHOG_API_KEY}" ]; then
              echo "TF_VAR_posthog_api_key=${POSTHOG_API_KEY}" >> "$GITHUB_ENV"
            elif [ -z "${ERROR_SINKS}" ]; then
              echo "TF_VAR_error_sinks=audit" >> "$GITHUB_ENV"
            elif [[ ",${ERROR_SINKS//[[:space:]]/}," == *",posthog,"* ]]; then
              echo "Missing required GitHub environment value: POSTHOG_API_KEY because ERROR_SINKS includes posthog" >&2
              exit 1
            fi

            if [ -n "${POSTHOG_API_KEY}" ] && [ -n "${POSTHOG_HOST}" ]; then
              echo "TF_VAR_posthog_host=${POSTHOG_HOST}" >> "$GITHUB_ENV"
            fi

            # The backend refuses to boot when a sink list names ops_webhook without both a
            # URL and a secret, so a missing one has to stop the deploy rather than roll out
            # a revision that crash-loops.
            CONFIGURED_SINKS=",${ERROR_SINKS//[[:space:]]/},${PRODUCT_ANALYTICS_SINKS//[[:space:]]/},"
            if [[ "${CONFIGURED_SINKS}" == *",ops_webhook,"* ]]; then
              for key in OPS_EVENT_WEBHOOK_URL OPS_EVENT_WEBHOOK_SECRET; do
                if [ -z "${!key}" ]; then
                  echo "Missing required GitHub environment value: $key because a sink list includes ops_webhook" >&2
                  exit 1
                fi
              done

              echo "TF_VAR_ops_event_webhook_url=${OPS_EVENT_WEBHOOK_URL}" >> "$GITHUB_ENV"
              echo "TF_VAR_ops_event_webhook_secret=${OPS_EVENT_WEBHOOK_SECRET}" >> "$GITHUB_ENV"

              if [ -n "${OPS_EVENT_WEBHOOK_EVENTS}" ]; then
                echo "TF_VAR_ops_event_webhook_events=${OPS_EVENT_WEBHOOK_EVENTS}" >> "$GITHUB_ENV"
              fi
            fi

            if [ "${OTEL_LOGS_ENABLED}" = "true" ]; then
              echo "TF_VAR_otel_logs_enabled=true" >> "$GITHUB_ENV"
            fi

            if [ -n "${OTEL_LOGS_MIN_LEVEL}" ]; then
              echo "TF_VAR_otel_logs_min_level=${OTEL_LOGS_MIN_LEVEL}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Resolve Terraform deployment values
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          INITIAL_BACKEND_IMAGE: ${{ inputs.initial_backend_image }}
          INITIAL_FRONTEND_IMAGE: ${{ inputs.initial_frontend_image }}
          INITIAL_WORKER_TASKS_SERVICE_URL: ${{ inputs.initial_worker_tasks_service_url }}
        run: |
          SERVICE_PREFIX="radioso-${ENVIRONMENT_NAME}"

          FRONTEND_URL=""
          WORKER_URL=""

          if [ -n "${INITIAL_BACKEND_IMAGE}" ] || [ -n "${INITIAL_FRONTEND_IMAGE}" ] || [ -n "${INITIAL_WORKER_TASKS_SERVICE_URL}" ]; then
            if [ -z "${INITIAL_BACKEND_IMAGE}" ] || [ -z "${INITIAL_FRONTEND_IMAGE}" ] || [ -z "${INITIAL_WORKER_TASKS_SERVICE_URL}" ]; then
              echo "initial_backend_image, initial_frontend_image, and initial_worker_tasks_service_url are all required for a bootstrap run." >&2
              exit 1
            fi
            if [[ ! "${INITIAL_WORKER_TASKS_SERVICE_URL}" =~ ^https://[^/[:space:]]+/?$ ]]; then
              echo "initial_worker_tasks_service_url must be a stable HTTPS endpoint for the worker service." >&2
              exit 1
            fi

            BACKEND_IMAGE="${INITIAL_BACKEND_IMAGE}"
            FRONTEND_IMAGE="${INITIAL_FRONTEND_IMAGE}"
            WORKER_URL="${INITIAL_WORKER_TASKS_SERVICE_URL%/}"
            echo "Using supplied initial images and worker service URL; remaining service URL overrides will be discovered on the next Terraform run."
          else
            if ! BACKEND_IMAGE="$(gcloud run services describe "${SERVICE_PREFIX}-backend" --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" --format='value(spec.template.spec.containers[0].image)')" ||
              ! FRONTEND_IMAGE="$(gcloud run services describe "${SERVICE_PREFIX}-frontend" --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" --format='value(spec.template.spec.containers[0].image)')" ||
              ! FRONTEND_URL="$(gcloud run services describe "${SERVICE_PREFIX}-frontend" --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" --format='value(status.url)')" ||
              ! WORKER_URL="$(gcloud run services describe "${SERVICE_PREFIX}-worker" --region "${GCP_REGION}" --project "${GCP_PROJECT_ID}" --format='value(status.url)')"
            then
              echo "Cloud Run services for ${ENVIRONMENT_NAME} are incomplete; supply all three initial bootstrap inputs for the first Terraform run." >&2
              exit 1
            fi
          fi

          if [ -z "${WORKER_URL}" ]; then
            echo "Worker service URL could not be resolved; refusing to use Terraform's placeholder URL." >&2
            exit 1
          fi

          APP_BASE_URL_OVERRIDE="${APP_BASE_URL:-$FRONTEND_URL}"
          if [ -z "${APP_BASE_URL_OVERRIDE}" ]; then
            echo "APP_BASE_URL must be configured when bootstrapping an environment without an existing frontend service." >&2
            exit 1
          fi
          PUBLIC_CHAT_BASE_URL_OVERRIDE="${PUBLIC_CHAT_BASE_URL:-${APP_BASE_URL_OVERRIDE%/}/chat}"

          echo "TF_VAR_backend_image=${BACKEND_IMAGE}" >> "$GITHUB_ENV"
          echo "TF_VAR_frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_ENV"
          echo "TF_VAR_radioso_mcp_enabled=${RADIOSO_MCP_ENABLED:-false}" >> "$GITHUB_ENV"
          echo "TF_VAR_app_base_url_override=${APP_BASE_URL_OVERRIDE}" >> "$GITHUB_ENV"
          echo "TF_VAR_public_chat_base_url_override=${PUBLIC_CHAT_BASE_URL_OVERRIDE}" >> "$GITHUB_ENV"
          # Public backend/API origin (e.g. https://api.example.com) where Slack and
          # OAuth providers reach the backend directly. Left null when unset so the
          # backend falls back to APP_BASE_URL (single-origin deployments).
          if [ -n "${CONNECTOR_PUBLIC_BASE_URL:-}" ]; then
            echo "TF_VAR_connector_public_base_url=${CONNECTOR_PUBLIC_BASE_URL}" >> "$GITHUB_ENV"
          fi
          echo "TF_VAR_worker_tasks_service_url_override=${WORKER_URL}" >> "$GITHUB_ENV"

      - name: Terraform init
        run: terraform -chdir="infra/terraform/environments/${{ inputs.environment }}" init -reconfigure -backend-config=backend.hcl

      - name: Terraform fmt
        run: terraform -chdir="infra/terraform" fmt -check -recursive

      - name: Terraform validate
        run: terraform -chdir="infra/terraform/environments/${{ inputs.environment }}" validate

      - name: Terraform plan
        run: terraform -chdir="infra/terraform/environments/${{ inputs.environment }}" plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform -chdir="infra/terraform/environments/${{ inputs.environment }}" apply -input=false -auto-approve tfplan
