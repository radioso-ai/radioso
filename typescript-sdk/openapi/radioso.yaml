openapi: 3.1.0
info:
  title: radioso API
  version: 0.1.0
  description: Code-generated OpenAPI contract for the radioso backend
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
  - name: Auth
  - name: Account
  - name: Workspace
  - name: Settings
  - name: Documents
  - name: Chat
  - name: Public Chat
  - name: Connectors
  - name: Connector Webhooks
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: radioso_session
    workspaceSelection:
      type: apiKey
      in: header
      name: X-Workspace-Id
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
            - code
            - message
      required:
        - error
    FlatErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
      required:
        - userId
        - accountId
        - organizationName
        - workspaceId
        - workspaceName
    LoginResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
      required:
        - userId
        - accountId
        - organizationName
        - workspaceId
        - workspaceName
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - accountId
        - name
        - createdAt
        - updatedAt
    WorkspaceListResponse:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
      required:
        - workspaces
    WorkspaceTokenResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        organizationName:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - email
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        preferredWorkspaceId:
          type: string
          format: uuid
        preferredAccountId:
          type: string
          format: uuid
      required:
        - email
        - password
    InvitationAcceptRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AccountInvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    WorkspaceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - name
    WorkspaceRenameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - name
    AccountUser:
      type: object
      properties:
        membershipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - member
        status:
          type: string
          enum:
            - active
        createdAt:
          type: string
          format: date-time
      required:
        - membershipId
        - userId
        - email
        - role
        - status
        - createdAt
    AccountInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - status
        - expiresAt
        - acceptedAt
        - createdAt
    AccountUsersResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        currentUserId:
          type: string
          format: uuid
        users:
          type: array
          items:
            $ref: "#/components/schemas/AccountUser"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/AccountInvitation"
      required:
        - accountId
        - currentUserId
        - users
        - invitations
    AccessibleAccount:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
        role:
          type: string
          enum:
            - owner
            - member
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
      required:
        - accountId
        - organizationName
        - role
        - workspaceId
        - workspaceName
    AccessibleAccountsResponse:
      type: object
      properties:
        currentAccountId:
          type: string
          format: uuid
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccessibleAccount"
      required:
        - currentAccountId
        - accounts
    CreateAccountInvitationResponse:
      allOf:
        - $ref: "#/components/schemas/AccountInvitation"
        - type: object
          properties:
            acceptanceUrl:
              type: string
          required:
            - acceptanceUrl
    InvitationDetailsResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expiresAt:
          type: string
          format: date-time
      required:
        - accountId
        - email
        - status
        - expiresAt
    RetrievalSettings:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        queryRewriteEnabled:
          type: boolean
        semanticRewriteInstructions:
          type: string
          maxLength: 2000
        lexicalRewriteInstructions:
          type: string
          maxLength: 2000
        answerSupportPolicy:
          type: string
          enum: &a2
            - strict
            - warn
            - off
        rerankEnabled:
          type: boolean
        vectorTopK:
          type: integer
          minimum: 1
          maximum: 300
        similarityThreshold:
          type: number
          minimum: 0
          maximum: 1
        rerankTopK:
          type: integer
          minimum: 1
        citationDisplayEnabled:
          type: boolean
        metadataFieldSuggestions:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              inferredType:
                type: string
                enum: &a1
                  - string
                  - number
                  - date
                  - boolean
            required:
              - field
              - inferredType
          default: []
        metadataRules:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              field:
                type: string
              valueType:
                type: string
                enum: *a1
              operator:
                type: string
                enum: &a3
                  - equals
                  - not_equals
                  - contains
                  - not_contains
                  - lt
                  - lte
                  - gt
                  - gte
              value:
                type: string
              effect:
                type: string
                enum: &a4
                  - boost
                  - filter
              enabled:
                type: boolean
            required:
              - id
              - field
              - valueType
              - operator
              - value
              - effect
              - enabled
          default: []
        customInstruction:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - workspaceId
        - queryRewriteEnabled
        - semanticRewriteInstructions
        - lexicalRewriteInstructions
        - answerSupportPolicy
        - rerankEnabled
        - vectorTopK
        - similarityThreshold
        - rerankTopK
        - citationDisplayEnabled
        - customInstruction
        - createdAt
        - updatedAt
    UpdateRetrievalSettingsRequest:
      type: object
      properties:
        queryRewriteEnabled:
          type: boolean
        semanticRewriteInstructions:
          type: string
          maxLength: 2000
        lexicalRewriteInstructions:
          type: string
          maxLength: 2000
        answerSupportPolicy:
          type: string
          enum: *a2
        rerankEnabled:
          type: boolean
        vectorTopK:
          type: integer
        similarityThreshold:
          type: number
        rerankTopK:
          type: integer
        citationDisplayEnabled:
          type: boolean
        metadataRules:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              field:
                type: string
                minLength: 1
              valueType:
                type: string
                enum: *a1
              operator:
                type: string
                enum: *a3
              value:
                type: string
              effect:
                type: string
                enum: *a4
              enabled:
                type: boolean
            required:
              - id
              - field
              - valueType
              - operator
              - value
              - effect
              - enabled
        customInstruction:
          type: string
          maxLength: 2000
      required:
        - queryRewriteEnabled
        - rerankEnabled
        - vectorTopK
        - similarityThreshold
        - rerankTopK
        - citationDisplayEnabled
    IngestionSettings:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        chunkingStrategy:
          type: string
          enum: &a5
            - fixed_window
            - structured_semantic
        fixedWindowChunkSize:
          type: integer
        fixedWindowChunkOverlap:
          type: integer
        structuredMinChunkSize:
          type: integer
        structuredMaxChunkSize:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - workspaceId
        - chunkingStrategy
        - fixedWindowChunkSize
        - fixedWindowChunkOverlap
        - structuredMinChunkSize
        - structuredMaxChunkSize
        - createdAt
        - updatedAt
    UpdateIngestionSettingsRequest:
      type: object
      properties:
        chunkingStrategy:
          type: string
          enum: *a5
        fixedWindowChunkSize:
          type: integer
          minimum: 100
          maximum: 4000
        fixedWindowChunkOverlap:
          type: integer
          minimum: 0
          maximum: 2000
        structuredMinChunkSize:
          type: integer
          minimum: 1
          maximum: 1000
        structuredMaxChunkSize:
          type: integer
          minimum: 1
          maximum: 2000
      required:
        - chunkingStrategy
        - fixedWindowChunkSize
        - fixedWindowChunkOverlap
        - structuredMinChunkSize
        - structuredMaxChunkSize
    RetrievalMetadataRule:
      type: object
      properties:
        id:
          type: string
        field:
          type: string
        valueType:
          type: string
          enum: *a1
        operator:
          type: string
          enum: *a3
        value:
          type: string
        effect:
          type: string
          enum: *a4
        enabled:
          type: boolean
      required:
        - id
        - field
        - valueType
        - operator
        - value
        - effect
        - enabled
    UpdateGeneralSettingsRequest:
      type: object
      properties:
        anonymousChatEnabled:
          type: boolean
        anonymousRateLimit:
          type: integer
          minimum: 1
          maximum: 60
    GeneralSettingsResponse:
      type: object
      properties:
        anonymousChatEnabled:
          type: boolean
        anonymousChatUrl:
          type:
            - string
            - "null"
        anonymousRateLimit:
          type: integer
          minimum: 1
          maximum: 60
      required:
        - anonymousChatEnabled
        - anonymousChatUrl
        - anonymousRateLimit
    WorkspaceIngestionReprocessResponse:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        queuedDocumentCount:
          type: integer
          minimum: 0
        skippedDocumentCount:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - queued
            - noop
      required:
        - workspaceId
        - queuedDocumentCount
        - skippedDocumentCount
        - status
    DocumentCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
              - type: "null"
      required:
        - title
        - content
    DocumentStatus:
      type: string
    DocumentOperationResponse:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DocumentStatus"
      required:
        - documentId
        - status
    RagStatus:
      type: string
    DocumentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/DocumentStatus"
        ragStatus:
          $ref: "#/components/schemas/RagStatus"
        failureReason:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
              - type: "null"
          default: {}
      required:
        - id
        - title
        - status
        - ragStatus
        - createdAt
        - updatedAt
    DocumentDetails:
      allOf:
        - $ref: "#/components/schemas/DocumentSummary"
        - type: object
          properties:
            content:
              type: string
          required:
            - content
    DocumentListResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"
        total:
          type: integer
          minimum: 0
        nextCursor:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
      required:
        - documents
        - total
        - nextCursor
        - hasMore
    DocumentSearchAction:
      type: object
      properties:
        type:
          type: string
          enum:
            - open_document
            - inspect_match_evidence
            - open_history_entry
            - rerun_search
        status:
          type: string
          enum:
            - available
            - unavailable
      required:
        - type
        - status
    DocumentSearchResult:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        title:
          type: string
        status:
          $ref: "#/components/schemas/DocumentStatus"
        ragStatus:
          $ref: "#/components/schemas/RagStatus"
        metadata:
          type: object
          additionalProperties: {}
        score:
          type: number
        rank:
          type: integer
          minimum: 1
        matchEvidence:
          type: array
          items:
            type: string
        sourceKind:
          type: string
          enum:
            - inline_text
            - uploaded_file
        sourceFilename:
          type:
            - string
            - "null"
        sourceMimeType:
          type:
            - string
            - "null"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSearchAction"
      required:
        - documentId
        - title
        - status
        - ragStatus
        - metadata
        - score
        - rank
        - matchEvidence
        - sourceKind
        - actions
    DocumentSearchHistoryEntry:
      type: object
      properties:
        searchId:
          type: string
          format: uuid
        query:
          type: string
        createdAt:
          type: string
          format: date-time
        resultCount:
          type: integer
          minimum: 0
        traceAvailable:
          type: boolean
        previewTopTitles:
          type: array
          items:
            type: string
      required:
        - searchId
        - query
        - createdAt
        - resultCount
        - traceAvailable
        - previewTopTitles
    DocumentSearchHistoryListResponse:
      type: object
      properties:
        searches:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSearchHistoryEntry"
        total:
          type: integer
          minimum: 0
        nextCursor:
          type:
            - string
            - "null"
        hasMore:
          type: boolean
      required:
        - searches
        - total
        - nextCursor
        - hasMore
    DocumentSearchRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        metadataFilter:
          type: object
          additionalProperties:
            anyOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
              - type: "null"
      required:
        - query
    Citation:
      type: object
      properties:
        documentId:
          type: string
          format: uuid
        chunkId:
          type: string
          format: uuid
        title:
          type: string
      required:
        - documentId
        - chunkId
        - title
    AnswerSegment:
      type: object
      properties:
        text:
          type: string
        citationIndices:
          type: array
          items:
            type: integer
            minimum: 0
      required:
        - text
    ParsedQuery:
      type: object
      properties:
        semanticQuery:
          type: string
        lexicalQuery:
          type: string
        constraintSummary:
          type: array
          items:
            type: string
      required:
        - semanticQuery
        - lexicalQuery
        - constraintSummary
    CandidateCounts:
      type: object
      properties:
        semantic:
          type: integer
          minimum: 0
        lexical:
          type: integer
          minimum: 0
        merged:
          type: integer
          minimum: 0
        final:
          type: integer
          minimum: 0
      required:
        - semantic
        - lexical
        - merged
        - final
    RetrievalSubquery:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        semanticQuery:
          type: string
        lexicalQuery:
          type: string
        reason:
          type: string
        responseLanguagePolicy:
          type: string
          enum:
            - match_user_question
      required:
        - id
        - label
        - semanticQuery
        - lexicalQuery
    AppliedConstraint:
      type: object
      properties:
        signalKey:
          type: string
        mode:
          type: string
          enum:
            - boost_only
            - hard_filter
        outcome:
          type: string
          enum:
            - applied
            - relaxed
            - skipped
        summary:
          type: string
      required:
        - signalKey
        - mode
        - outcome
        - summary
    RewriteInfo:
      type: object
      properties:
        status:
          type: string
        eligible:
          type: boolean
        ran:
          type: boolean
        materialDisagreement:
          type: boolean
        continuityDecision:
          type: string
        rejectionReason:
          type: string
      required:
        - status
        - eligible
        - ran
        - materialDisagreement
    RetrievalInfo:
      type: object
      properties:
        parsedQuery:
          $ref: "#/components/schemas/ParsedQuery"
        retrievalSubqueries:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalSubquery"
        responseLanguagePolicy:
          type: string
          enum:
            - match_user_question
        candidateCounts:
          $ref: "#/components/schemas/CandidateCounts"
        appliedConstraints:
          type: array
          items:
            $ref: "#/components/schemas/AppliedConstraint"
        fallbackApplied:
          type: boolean
        rerankStatus:
          type: string
          enum:
            - skipped
            - applied
            - fallback
        rewrite:
          $ref: "#/components/schemas/RewriteInfo"
      required:
        - candidateCounts
        - fallbackApplied
        - rerankStatus
    RetrievalTraceStage:
      type: object
      properties:
        stageId:
          type: string
        kind:
          type: string
        label:
          type: string
        status:
          type: string
          enum:
            - applied
            - skipped
            - fallback
            - rejected
            - unavailable
            - failed
        startedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          minimum: 0
        settings:
          type: object
          additionalProperties: {}
        inputs:
          type: object
          additionalProperties: {}
        outputs:
          type: object
          additionalProperties: {}
        metrics:
          type: object
          additionalProperties:
            type: number
        reason:
          type: string
      required:
        - stageId
        - kind
        - label
        - status
    RetrievalTraceLink:
      type: object
      properties:
        fromStageId:
          type: string
        toStageId:
          type: string
        kind:
          type: string
          enum:
            - sequence
            - branch
            - converge
      required:
        - fromStageId
        - toStageId
        - kind
    RetrievalTrace:
      type: object
      properties:
        traceId:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        totalDurationMs:
          type: integer
          minimum: 0
        stages:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalTraceStage"
        links:
          type: array
          items:
            $ref: "#/components/schemas/RetrievalTraceLink"
        summary:
          $ref: "#/components/schemas/RetrievalInfo"
      required:
        - traceId
        - startedAt
        - stages
        - links
    DocumentSearchResponse:
      type: object
      properties:
        searchId:
          type: string
          format: uuid
        mode:
          type: string
          enum:
            - live
            - snapshot
        query:
          type: string
        resultCount:
          type: integer
          minimum: 0
        results:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSearchResult"
        retrievalTrace:
          $ref: "#/components/schemas/RetrievalTrace"
      required:
        - searchId
        - mode
        - query
        - resultCount
        - results
    ChatResponse:
      type: object
      properties:
        conversationId:
          type: string
          format: uuid
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        answerSegments:
          type: array
          items:
            $ref: "#/components/schemas/AnswerSegment"
        retrievalInfo:
          $ref: "#/components/schemas/RetrievalInfo"
        retrievalTrace:
          $ref: "#/components/schemas/RetrievalTrace"
      required:
        - conversationId
        - answer
        - retrievalInfo
        - retrievalTrace
    ChatRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        stream:
          type: boolean
        conversationId:
          type: string
          format: uuid
        metadataFilter:
          type: object
          additionalProperties: {}
      required:
        - query
        - stream
    PublicChatRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        stream:
          type: boolean
          default: false
        conversationId:
          type: string
          format: uuid
      required:
        - query
    ChatConversationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sourceChannel:
          type:
            - string
            - "null"
        anonymousSessionId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
          minimum: 0
        userMessageCount:
          type: integer
          minimum: 0
