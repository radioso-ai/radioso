name: Deploy Live (US Legacy)

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to ship, such as v1.4.0. Cut it first with the Cut Release workflow.
        required: true
        type: string

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloud-run.yml
    permissions:
      contents: read
      id-token: write
    with:
      github_environment: live
      artifact_repository: radioso-live
      backend_service: radioso-live-backend
      crawler_worker_service: radioso-live-crawler-worker
      frontend_service: radioso-live-frontend
      mcp_service: radioso-live-mcp
      worker_service: radioso-live-worker
      require_main_branch: true
      radioso_edition: enterprise
      release: ${{ inputs.release }}
