name: Deploy Staging

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_deploy-cloud-run.yml
      - .github/workflows/deploy-staging.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .dockerignore
      - backend/**
      - frontend/**
      - infra/backend.Dockerfile
      - infra/frontend.Dockerfile
      - frontend/Dockerfile
      - ee/**
      - packages/connector-api/**
      - packages/crawler/**
      - packages/conversation-contract/**
      - packages/conversation-defaults/**
      - packages/conversation-engine/**
      - packages/conversation-tools/**
      - packages/document-parser/**
      - packages/mcp-source-proof/**
      - packages/routine-definition/**
      - packages/routine-document/**
      - packages/radioso-mcp-server/**
      - packages/workspace-invalidation-contract/**
      - scripts/sync-ee-frontend-routes.mjs
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-cloud-run.yml
    permissions:
      contents: read
      id-token: write
    with:
      github_environment: staging
      artifact_repository: radioso-staging
      backend_service: radioso-staging-backend
      crawler_worker_service: radioso-staging-crawler-worker
      frontend_service: radioso-staging-frontend
      mcp_service: radioso-staging-mcp
      worker_service: radioso-staging-worker
      radioso_edition: enterprise
