name: CI

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base branch to diff against when selecting path-scoped jobs.
        required: true
        default: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.filter.outputs.run_ci }}
      backend: ${{ steps.filter.outputs.backend }}
      backend_openapi: ${{ steps.filter.outputs.backend_openapi }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      typescript_sdk: ${{ steps.filter.outputs.typescript_sdk }}
      mcp_server: ${{ steps.filter.outputs.mcp_server }}
      crawler: ${{ steps.filter.outputs.crawler }}
      ee: ${{ steps.filter.outputs.ee }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - id: filter
        name: Detect CI-relevant changes
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail

          # Fetch full history (not --depth=1) so a merge base with HEAD exists;
          # otherwise the diff below finds no common ancestor and silently reports
          # zero changed files, skipping every CI job.
          git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

          backend=false
          frontend=false
          docs=false
          typescript_sdk=false
          mcp_server=false
          crawler=false
          ee=false

          mark_all() {
            backend=true
            frontend=true
            docs=true
            typescript_sdk=true
            mcp_server=true
            crawler=true
            ee=true
          }

          # Fail safe: if the diff cannot be computed (e.g. no merge base), run
          # every bucket rather than silently skipping all of them.
          if ! changed_files="$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null)"; then
            echo "Could not diff against origin/${BASE_REF}; running all CI buckets."
            mark_all
            changed_files=""
          fi

          while IFS= read -r path; do
            [ -n "$path" ] || continue

            case "$path" in
              .github/workflows/ci.yml|package.json|pnpm-lock.yaml|pnpm-workspace.yaml|scripts/*)
                mark_all
                ;;
              .github/workflows/*|infra/*|.dockerignore|*/.dockerignore|Dockerfile|*/Dockerfile|*.Dockerfile)
                ;;
              backend/*)
                backend=true
                frontend=true
                docs=true
                typescript_sdk=true
                mcp_server=true
                ;;
              frontend/*)
                frontend=true
                ;;
              docs-portal/*)
                docs=true
                ;;
              docs/settings-docs/*)
                frontend=true
                docs=true
                ;;
              docs/*|readme.md)
                docs=true
                ;;
              typescript-sdk/*)
                frontend=true
                typescript_sdk=true
                ;;
              packages/radioso-mcp-server/*)
                mcp_server=true
                ;;
              packages/crawler/*)
                backend=true
                crawler=true
                ;;
              packages/document-parser/*|packages/connector-api/*)
                backend=true
                ;;
              ee/*)
                ee=true
                ;;
              *)
                mark_all
                ;;
            esac
          done <<< "$changed_files"

          backend_openapi="${backend}"
          run_ci=false
          for value in "$backend" "$frontend" "$docs" "$typescript_sdk" "$mcp_server" "$crawler" "$ee"; do
            if [ "$value" = true ]; then
              run_ci=true
              break
            fi
          done

          {
            echo "run_ci=${run_ci}"
            echo "backend=${backend}"
            echo "backend_openapi=${backend_openapi}"
            echo "frontend=${frontend}"
            echo "docs=${docs}"
            echo "typescript_sdk=${typescript_sdk}"
            echo "mcp_server=${mcp_server}"
            echo "crawler=${crawler}"
            echo "ee=${ee}"
          } >> "$GITHUB_OUTPUT"

  backend-build-openapi:
    name: Backend Build and OpenAPI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter radioso-backend... --filter @radioso/crawler...

      - name: Lint backend module boundaries
        working-directory: backend
        run: pnpm run lint:boundaries

      - name: Build backend
        working-directory: backend
        run: pnpm run build

      - name: Upload backend OpenAPI artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: backend-openapi
          path: |
            backend/openapi.json
            backend/openapi.yaml
          if-no-files-found: error

  backend-unit:
    name: Backend Unit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter radioso-backend... --filter @radioso/crawler...

      - name: Test backend unit suite
        working-directory: backend
        run: pnpm run test:unit

  backend-integration:
    name: Backend Integration Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: radioso_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d radioso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTEGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/radioso_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter radioso-backend... --filter @radioso/crawler...

      - name: Test backend integration suite
        working-directory: backend
        run: pnpm run test:integration

  backend-contract:
    name: Backend Contract Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter radioso-backend... --filter @radioso/crawler...

      - name: Test backend contracts
        working-directory: backend
        run: pnpm run test:contract

  backend:
    name: Backend
    needs:
      - changes
      - backend-build-openapi
      - backend-unit
      - backend-integration
      - backend-contract
    if: always() && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      BUILD_RESULT: ${{ needs['backend-build-openapi'].result }}
      UNIT_RESULT: ${{ needs['backend-unit'].result }}
      INTEGRATION_RESULT: ${{ needs['backend-integration'].result }}
      CONTRACT_RESULT: ${{ needs['backend-contract'].result }}
    steps:
      - name: Verify backend jobs
        run: |
          set -euo pipefail

          for result in "$BUILD_RESULT" "$UNIT_RESULT" "$INTEGRATION_RESULT" "$CONTRACT_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Backend split job completed with result: ${result}"
              exit 1
            fi
          done

  frontend:
    name: Frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter radioso-frontend...

      - name: Lint frontend
        working-directory: frontend
        run: pnpm run lint

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Test frontend unit suite
        working-directory: frontend
        run: pnpm test

      - name: Restore Playwright browser cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Test frontend end-to-end suite
        working-directory: frontend
        run: pnpm run test:e2e

  docs-portal:
    name: Docs Portal
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend-build-openapi
    if: always() && needs.changes.outputs.docs == 'true' && (needs.changes.outputs.backend_openapi != 'true' || needs['backend-build-openapi'].result == 'success')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Download backend OpenAPI artifacts
        if: needs.changes.outputs.backend_openapi == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: backend-openapi
          path: backend

      - name: Install docs portal dependencies
        run: pnpm install --frozen-lockfile --filter radioso-docs-portal...

      - name: Lint docs portal
        working-directory: docs-portal
        run: pnpm run lint

      - name: Build docs portal
        working-directory: docs-portal
        run: pnpm run build

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    needs:
      - changes
      - backend-build-openapi
    if: always() && needs.changes.outputs.typescript_sdk == 'true' && (needs.changes.outputs.backend_openapi != 'true' || needs['backend-build-openapi'].result == 'success')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Download backend OpenAPI artifacts
        if: needs.changes.outputs.backend_openapi == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: backend-openapi
          path: backend

      - name: Install TypeScript SDK dependencies
        run: pnpm install --frozen-lockfile --filter @radioso/typescript-sdk...

      - name: Build TypeScript SDK
        working-directory: typescript-sdk
        run: pnpm run build

      - name: Test TypeScript SDK
        working-directory: typescript-sdk
        run: pnpm test

  mcp-server:
    name: MCP Server
    needs:
      - changes
      - backend-build-openapi
    if: always() && needs.changes.outputs.mcp_server == 'true' && (needs.changes.outputs.backend_openapi != 'true' || needs['backend-build-openapi'].result == 'success')
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RADIOSO_MCP_SMOKE_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Download backend OpenAPI artifacts
        if: needs.changes.outputs.backend_openapi == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: backend-openapi
          path: backend

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter radioso-backend... --filter @radioso/mcp-server...

      - name: Build MCP server
        working-directory: packages/radioso-mcp-server
        run: pnpm run build

      - name: Test MCP server
        working-directory: packages/radioso-mcp-server
        run: pnpm test

      - name: Smoke test MCP server
        working-directory: packages/radioso-mcp-server
        run: pnpm run smoke:all

  crawler:
    name: Crawler Package
    needs: changes
    if: needs.changes.outputs.crawler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install crawler dependencies
        run: pnpm install --frozen-lockfile --filter @radioso/crawler...

      - name: Build crawler
        working-directory: packages/crawler
        run: pnpm run build

      - name: Test crawler
        working-directory: packages/crawler
        run: pnpm test

  ee:
    name: Enterprise Edition
    needs: changes
    if: needs.changes.outputs.ee == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm for dependency cache
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install Enterprise Edition dependencies
        run: pnpm install --frozen-lockfile --filter './ee/packages/*...'

      - name: Build Enterprise Edition packages
        working-directory: ee
        run: pnpm run build

      - name: Test Enterprise Edition packages
        working-directory: ee
        run: pnpm test
