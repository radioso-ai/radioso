openapi: 3.0.3
info:
  title: Account Usage & Chat Usage API
  version: 1.0.0
  description: Account-level usage summaries and chat history usage debug payloads.

paths:
  /api/v1/account/usage:
    get:
      summary: Get account usage summary
      description: Returns account-wide daily and monthly token usage across all workspaces for the authenticated session user.
      operationId: getAccountUsage
      security:
        - sessionCookie: []
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
        - name: months
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 24
            default: 12
      responses:
        "200":
          description: Account usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountUsageSummary"
        "401":
          description: Not authenticated

  /api/v1/chat/history/{conversationId}:
    get:
      summary: Get conversation history with usage debug
      description: Returns chat history detail for a workspace-scoped conversation, including assistant-turn usage totals and per-operation breakdowns when available.
      operationId: getConversationHistory
      security:
        - workspaceToken: []
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatConversationDetail"
        "400":
          description: Invalid conversation id
        "401":
          description: Invalid or missing workspace token
        "404":
          description: Conversation not found in workspace

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: hivec_session
    workspaceToken:
      type: http
      scheme: bearer

  schemas:
    TokenUsageTotals:
      type: object
      required:
        - promptTokens
        - completionTokens
        - totalTokens
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0

    UsageBreakdownItem:
      type: object
      required:
        - operationType
        - model
        - status
        - usageAvailable
        - recordedAt
      properties:
        operationType:
          type: string
        model:
          type: string
        status:
          type: string
          enum: [success, failure, usage_unavailable]
        usageAvailable:
          type: boolean
        promptTokens:
          type: integer
          minimum: 0
          nullable: true
        completionTokens:
          type: integer
          minimum: 0
          nullable: true
        totalTokens:
          type: integer
          minimum: 0
          nullable: true
        recordedAt:
          type: string
          format: date-time

    ChatConversationTurnDebug:
      type: object
      required:
        - eventStatus
        - recordedAt
        - stream
        - citationCount
      properties:
        eventStatus:
          type: string
          enum: [success, failure]
        recordedAt:
          type: string
          format: date-time
        stream:
          type: boolean
        citationCount:
          type: integer
          minimum: 0
        usageTotals:
          $ref: "#/components/schemas/TokenUsageTotals"
        usageBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/UsageBreakdownItem"
        errorMessage:
          type: string
          nullable: true

    ChatConversationTurn:
      type: object
      required:
        - id
        - role
        - content
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        debug:
          $ref: "#/components/schemas/ChatConversationTurnDebug"

    ChatConversationDetail:
      type: object
      required:
        - conversationId
        - workspaceId
        - createdAt
        - updatedAt
        - messageCount
        - userMessageCount
        - assistantMessageCount
        - messages
      properties:
        conversationId:
          type: string
          format: uuid
        workspaceId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        messageCount:
          type: integer
        userMessageCount:
          type: integer
        assistantMessageCount:
          type: integer
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatConversationTurn"

    DailyUsageRow:
      type: object
      required:
        - date
        - totals
      properties:
        date:
          type: string
          format: date
        totals:
          $ref: "#/components/schemas/TokenUsageTotals"

    MonthlyUsageRow:
      type: object
      required:
        - month
        - totals
      properties:
        month:
          type: string
          description: UTC month bucket in YYYY-MM format
        totals:
          $ref: "#/components/schemas/TokenUsageTotals"

    AccountUsageSummary:
      type: object
      required:
        - today
        - currentMonth
        - daily
        - monthly
      properties:
        today:
          $ref: "#/components/schemas/TokenUsageTotals"
        currentMonth:
          $ref: "#/components/schemas/TokenUsageTotals"
        daily:
          type: array
          items:
            $ref: "#/components/schemas/DailyUsageRow"
        monthly:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyUsageRow"
