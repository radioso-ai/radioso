name: Publish n8n community node

# n8n only verifies community nodes that are published from GitHub Actions with an npm
# provenance statement. Cut a release by pushing a tag that matches the package version, on a
# commit that is on main:
#   git tag n8n-nodes-radioso-v0.1.0 && git push origin n8n-nodes-radioso-v0.1.0
#
# Publishing relies on npm Trusted Publishing (OIDC) alone. No npm token is read here, so a leaked
# token cannot publish this package. One-time owner setup:
#   - create the `npm-publish` GitHub environment, limited to `n8n-nodes-radioso-v*` tags;
#   - on npmjs.com bind the package's Trusted Publisher to owner radioso-ai, repository radioso,
#     workflow publish-n8n-node.yml and environment npm-publish, and turn on "disallow tokens";
#   - add tag rulesets for `n8n-nodes-radioso-v*` so only maintainers can create them.
#
# The build job runs the package's code (install scripts off) with read-only access. The publish
# job has the OIDC permission but runs no repository code: it publishes the tarball the build
# job produced.

on:
  push:
    tags:
      - "n8n-nodes-radioso-v*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build package tarball
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/n8n-nodes-radioso
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/n8n-nodes-radioso/package-lock.json

      - name: Verify the tag is on main and matches the package version
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit ${GITHUB_SHA} is not on main." >&2
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#n8n-nodes-radioso-v}"
          if [ "$package_version" != "$tag_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"

      - name: Check the tarball carries every declared node and credential
        run: |
          contents="$(tar -tzf "$RUNNER_TEMP"/package/*.tgz)"
          node -p "const n = require('./package.json').n8n; [...n.credentials, ...n.nodes].join('\n')" |
            while read -r path; do
              if ! grep -qxF "package/${path}" <<<"$contents"; then
                echo "The tarball is missing ${path}." >&2
                exit 1
              fi
            done

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: n8n-node-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      # Mints the OIDC token npm signs the provenance statement with.
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Require an npm that supports Trusted Publishing
        run: |
          version="$(npm --version)"
          if ! printf '11.5.1\n%s\n' "$version" | sort -V -C; then
            echo "npm ${version} is older than 11.5.1, which Trusted Publishing needs." >&2
            exit 1
          fi

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: n8n-node-package
          path: package

      # The ./ prefix keeps npm from reading package/<file> as a GitHub owner/repo spec.
      - name: Publish with provenance
        run: npm publish ./package/*.tgz --provenance --access public
