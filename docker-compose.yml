name: radioso

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: radioso-postgres
    shm_size: "1gb"
    environment:
      POSTGRES_DB: radioso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - radioso_postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d radioso"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    container_name: radioso-backend
    pull_policy: build
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/radioso
      SESSION_TTL_HOURS: 168
    volumes:
      - radioso_document_storage:/app/.context/document-storage
    command: ["npm", "run", "start:http"]
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:8080/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend-worker:
    container_name: radioso-backend-worker
    pull_policy: build
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/radioso
      SESSION_TTL_HOURS: 168
    volumes:
      - radioso_document_storage:/app/.context/document-storage
    command: ["npm", "run", "start:worker"]

  backend-crawler-worker:
    container_name: radioso-backend-crawler-worker
    pull_policy: build
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/radioso
      SESSION_TTL_HOURS: 168
    volumes:
      - radioso_document_storage:/app/.context/document-storage
    command: ["npm", "run", "start:crawler-worker"]

  frontend:
    container_name: radioso-frontend
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"

volumes:
  radioso_postgres_data:
  radioso_document_storage:
