name: Cut Release

# A release names a commit, not a deployment. Radioso serves more than one production stack,
# so a version minted at deploy time would either give one commit two numbers or hide that one
# stack is several releases behind another. Cut the tag here when a batch on main is ready;
# the deploy workflows are then told which release to ship.
#
# The first release has no previous tag to read from, so it needs both inputs:
#   version: 1.0.0   since: <commit the release starts after>

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to pick the next version. "auto" reads the commit subjects since the last tag.
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      version:
        description: Explicit version such as 1.0.0. Overrides the bump. Required for the first release.
        type: string
        default: ""
      since:
        description: Commit or tag the release starts after. Defaults to the previous v* tag.
        type: string
        default: ""
      dry_run:
        description: Render the notes without committing, tagging or publishing.
        type: boolean
        default: true

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Cut release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::A release must be cut from main; this run is on ${GITHUB_REF}."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # The generator reads commit history and the previous v* tag, neither of which
          # survives a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          # This job installs nothing, so there is no package manager for setup-node to
          # detect a cache for. Left on, it looks for pnpm and fails before the tests run.
          package-manager-cache: false

      - name: Verify the release tooling
        run: node --test tests/release/*.test.mjs

      - name: Render the release
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          SINCE: ${{ inputs.since }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          args=(--bump="$BUMP" --notes-out=release-notes.md)
          if [ -n "$VERSION" ]; then args+=(--version="$VERSION"); fi
          if [ -n "$SINCE" ]; then args+=(--since="$SINCE"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi

          node scripts/release/cut-release.mjs "${args[@]}"

      - name: Publish the notes to the run summary
        run: |
          {
            echo "## ${{ steps.release.outputs.tag }}"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag and publish
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md package.json
          git commit -m "chore(release): ${TAG}"
          git tag -a "${TAG}" -m "${TAG}"

          # The tag has to reach the remote before the release references it, and both have to
          # land before anyone can deploy this version.
          git push origin HEAD:main
          git push origin "${TAG}"

          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md \
            --verify-tag
