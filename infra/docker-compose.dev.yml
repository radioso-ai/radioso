services:
  backend:
    build:
      context: ..
      dockerfile: infra/backend.dev.Dockerfile
    environment:
      NODE_ENV: development
    volumes:
      - ../backend:/app/backend
      - ../packages/connector-api:/app/packages/connector-api
      - hivec_backend_node_modules:/app/backend/node_modules

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.dev.Dockerfile
    environment:
      NODE_ENV: development
      BACKEND_INTERNAL_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ../frontend:/app
      - hivec_frontend_node_modules:/app/node_modules
    command: ["npx", "next", "dev", "-H", "0.0.0.0", "-p", "3000"]

volumes:
  hivec_backend_node_modules:
  hivec_frontend_node_modules:
