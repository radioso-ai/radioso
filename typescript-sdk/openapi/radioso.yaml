openapi: 3.1.0
info:
  title: radioso API
  version: 0.1.0
  description: Code-generated OpenAPI contract for the radioso backend
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
  - name: Auth
  - name: Account
  - name: Workspace
  - name: Assistant
  - name: History
  - name: Retrieval
  - name: Settings
  - name: Documents
  - name: Connectors
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: radioso_session
    workspaceSelection:
      type: apiKey
      in: header
      name: X-Workspace-Id
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
            - code
            - message
      required:
        - error
    FlatErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        workspacePublicRouteKey:
          type: string
        requiresEmailVerification:
          type: boolean
      required:
        - userId
        - accountId
        - organizationName
        - workspaceId
        - workspaceName
        - workspacePublicRouteKey
        - requiresEmailVerification
    LoginResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        workspacePublicRouteKey:
          type: string
      required:
        - userId
        - accountId
        - organizationName
        - workspaceId
        - workspaceName
        - workspacePublicRouteKey
    PasswordResetConfirmResponse:
      allOf:
        - $ref: "#/components/schemas/LoginResponse"
        - type: object
          properties:
            email:
              type: string
              format: email
          required:
            - email
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        name:
          type: string
        publicRouteKey:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - accountId
        - name
        - publicRouteKey
        - createdAt
        - updatedAt
    WorkspaceRouteResolutionResponse:
      type: object
      properties:
        workspaceKey:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
      required:
        - workspaceKey
        - workspaceId
        - workspaceName
        - accountId
        - organizationName
    WorkspaceListResponse:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
      required:
        - workspaces
    WorkspaceTokenResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    WorkspaceMcpContextResponse:
      type: object
      properties:
        apiVersion:
          type: string
          enum:
            - 0.1.0
        mcpContextVersion:
          type: string
          enum:
            - 2026-04-22
        supportedTools:
          type: array
          items:
            type: string
            enum:
              - answer_grounded
              - create_document
              - delete_document
              - describe_capabilities
              - get_document
              - get_retrieval_settings
              - list_documents
              - reprocess_document
              - search_documents
              - update_document
              - update_retrieval_settings
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
          minLength: 1
      required:
        - apiVersion
        - mcpContextVersion
        - supportedTools
        - workspaceId
        - workspaceName
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        organizationName:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - email
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        preferredWorkspaceId:
          type: string
          format: uuid
        preferredAccountId:
          type: string
          format: uuid
      required:
        - email
        - password
    InvitationAcceptRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
      required:
        - token
        - password
    EmailVerificationVerifyRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
        - token
    EmailVerificationResendRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    AccountInvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    WorkspaceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - name
    WorkspaceRenameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - name
    AccountUser:
      type: object
      properties:
        membershipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - member
        status:
          type: string
          enum:
            - active
        createdAt:
          type: string
          format: date-time
      required:
        - membershipId
        - userId
        - email
        - role
        - status
        - createdAt
    AccountInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - status
        - expiresAt
        - acceptedAt
        - createdAt
    AccountUsersResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        currentUserId:
          type: string
          format: uuid
        users:
          type: array
          items:
            $ref: "#/components/schemas/AccountUser"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/AccountInvitation"
      required:
        - accountId
        - currentUserId
        - users
        - invitations
    AccessibleAccount:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
        role:
          type: string
          enum:
            - owner
            - member
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        workspacePublicRouteKey:
          type: string
      required:
        - accountId
        - organizationName
        - role
        - workspaceId
        - workspaceName
        - workspacePublicRouteKey
    AccessibleAccountsResponse:
      type: object
      properties:
        currentAccountId:
          type: string
          format: uuid
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccessibleAccount"
      required:
        - currentAccountId
        - accounts
    CreateAccountInvitationResponse:
      allOf:
        - $ref: "#/components/schemas/AccountInvitation"
        - type: object
          properties:
            acceptanceUrl:
              type: string
          required:
            - acceptanceUrl
    InvitationDetailsResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expiresAt:
          type: string
          format: date-time
      required:
        - accountId
        - email
        - status
        - expiresAt
    PasswordResetAcceptedResponse:
      type: object
      properties:
        accepted:
          type: boolean
          enum:
            - true
      required:
        - accepted
    EmailVerificationVerifiedResponse:
      type: object
      properties:
        verified:
          type: boolean
          enum:
            - true
      required:
        - verified
    RetrievalSettings:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        queryRewriteEnabled:
          type: boolean
        semanticRewriteInstructions:
          type: string
          maxLength: 2000
        lexicalRewriteInstructions:
          type: string
          maxLength: 2000
        conversationMode:
          type: string
          enum: &a3
            - factual
            - guided
            - exploratory
        suggestedQuestionsEnabled:
          type: boolean
        suggestedQuestionsCount:
          type: integer
          minimum: 1
          maximum: 4
        rerankEnabled:
          type: boolean
        vectorTopK:
          type: integer
          minimum: 1
          maximum: 300
        similarityThreshold:
          type: number
          minimum: 0
          maximum: 1
        rerankTopK:
          type: integer
          minimum: 1
        citationDisplayEnabled:
          type: boolean
        metadataFieldSuggestions:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              inferredType:
                type: string
                enum: &a1
                  - string
                  - number
                  - date
                  - boolean
            required:
              - field
              - inferredType
          default: []
        metadataRules:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              field:
                type: string
              valueType:
                type: string
                enum: *a1
              operator:
                type: string
                enum: &a2
                  - equals
                  - not_equals
                  - contains
                  - not_contains
                  - lt
                  - lte
                  - gt
                  - gte
              value:
                type: string
              combinator:
                type: string
                enum:
                  - and
                  - or
                default: and
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    field:
                      type: string
                    valueType:
                      type: string
                      enum: *a1
                    operator:
                      type: string
                      enum: *a2
                    value:
                      type: string
                  required:
                    - id
                    - field
                    - valueType
                    - operator
                    - value
                default: []
              effect:
                type: string
                enum: &a4
                  - boost
                  - filter
              enabled:
                type: boolean
              triggerMode:
                type: string
                enum: &a5
                  - always_on
                  - match_turn
              triggerInstruction:
                type: string
            required:
              - id
              - field
              - valueType
              - operator
              - value
              - effect
              - enabled
              - triggerMode
          default: []
        customInstruction:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - workspaceId
        - queryRewriteEnabled
        - semanticRewriteInstructions
        - lexicalRewriteInstructions
        - conversationMode
        - suggestedQuestionsEnabled
        - suggestedQuestionsCount
        - rerankEnabled
        - vectorTopK
        - similarityThreshold
        - rerankTopK
        - citationDisplayEnabled
        - customInstruction
        - createdAt
        - updatedAt
    UpdateRetrievalSettingsRequest:
      type: object
      properties:
        queryRewriteEnabled:
          type: boolean
        semanticRewriteInstructions:
          type: string
          maxLength: 2000
        lexicalRewriteInstructions:
          type: string
          maxLength: 2000
        conversationMode:
          type: string
          enum: *a3
        suggestedQuestionsEnabled:
          type: boolean
        suggestedQuestionsCount:
          type: integer
          minimum: 1
          maximum: 4
        rerankEnabled:
          type: boolean
        vectorTopK:
          type: integer
        similarityThreshold:
          type: number
        rerankTopK:
          type: integer
          maximum: 50
        citationDisplayEnabled:
          type: boolean
        metadataRules:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              field:
                type: string
                minLength: 1
              valueType:
                type: string
                enum: *a1
              operator:
                type: string
                enum: *a2
              value:
                type: string
              combinator:
                type: string
                enum: &a9
                  - and
                  - or
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                    field:
                      type: string
                      minLength: 1
                    valueType:
                      type: string
                      enum: *a1
                    operator:
                      type: string
                      enum: *a2
                    value:
                      type: string
                  required:
                    - id
                    - field
                    - valueType
                    - operator
                    - value
              effect:
                type: string
                enum: *a4
              enabled:
                type: boolean
              triggerMode:
                type: string
                enum: *a5
              triggerInstruction:
                type: string
                maxLength: 500
            required:
              - id
              - effect
              - enabled
        customInstruction:
          type: string
          maxLength: 2000
      required:
        - queryRewriteEnabled
        - rerankEnabled
        - vectorTopK
        - similarityThreshold
        - rerankTopK
        - citationDisplayEnabled
    IngestionSettings:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        chunkingStrategy:
          type: string
          enum: &a6
            - fixed_window
            - structured_semantic
        fixedWindowChunkSize:
          type: integer
        fixedWindowChunkOverlap:
          type: integer
        structuredMinChunkSize:
          type: integer
        structuredMaxChunkSize:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - workspaceId
        - chunkingStrategy
        - fixedWindowChunkSize
        - fixedWindowChunkOverlap
        - structuredMinChunkSize
        - structuredMaxChunkSize
        - createdAt
        - updatedAt
    UpdateIngestionSettingsRequest:
      type: object
      properties:
        chunkingStrategy:
          type: string
          enum: *a6
        fixedWindowChunkSize:
          type: integer
          minimum: 100
          maximum: 4000
        fixedWindowChunkOverlap:
          type: integer
          minimum: 0
          maximum: 2000
        structuredMinChunkSize:
          type: integer
          minimum: 1
          maximum: 1000
        structuredMaxChunkSize:
          type: integer
          minimum: 1
          maximum: 2000
      required:
        - chunkingStrategy
        - fixedWindowChunkSize
        - fixedWindowChunkOverlap
        - structuredMinChunkSize
        - structuredMaxChunkSize
    RetrievalMetadataRule:
      type: object
      properties:
        id:
          type: string
        field:
          type: string
        valueType:
          type: string
          enum: *a1
        operator:
          type: string
          enum: *a2
        value:
          type: string
        combinator:
          type: string
          enum:
            - and
            - or
          default: and
        conditions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              field:
                type: string
              valueType:
                type: string
                enum: *a1
              operator:
                type: string
                enum: *a2
              value:
                type: string
            required:
              - id
              - field
              - valueType
              - operator
              - value
          default: []
        effect:
          type: string
          enum: *a4
        enabled:
          type: boolean
        triggerMode:
          type: string
          enum: *a5
        triggerInstruction:
          type: string
      required:
        - id
        - field
        - valueType
        - operator
        - value
        - effect
        - enabled
        - triggerMode
    TriggerAnalysisRule:
      type: object
      properties:
        ruleId:
          type: string
        matched:
          type: boolean
        matchStrength:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string
        triggerInstructionPreview:
          type: string
      required:
        - ruleId
        - matched
        - matchStrength
        - reason
        - triggerInstructionPreview
    TriggerAnalysis:
      type: object
      properties:
        status:
          type: string
          enum:
            - skipped_not_configured
            - skipped_unavailable
            - applied
            - fallback
        consideredRules:
          type: array
          items:
            $ref: "#/components/schemas/TriggerAnalysisRule"
        matchedRuleIds:
          type: array
          items:
            type: string
        unmatchedRuleIds:
          type: array
          items:
            type: string
        matchCount:
          type: integer
          minimum: 0
        matcherVersion:
          type: string
        failureReason:
          type: string
      required:
        - status
        - consideredRules
        - matchedRuleIds
        - unmatchedRuleIds
        - matchCount
        - matcherVersion
    TriggerBackoff:
      type: object
      properties:
        applied:
          type: boolean
        reason:
          type: string
          enum:
            - empty_filtered_candidates
            - weak_filtered_support
        relaxedRuleIds:
          type: array
          items:
            type: string
        restoredCandidateCount:
          type: integer
          minimum: 0
      required:
        - applied
        - relaxedRuleIds
    UpdateGeneralSettingsRequest:
      type: object
      properties:
        anonymousChatEnabled:
          type: boolean
        anonymousRateLimit:
          type: integer
