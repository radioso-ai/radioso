        - anonymousRateLimit
        - assistantName
        - assistantRole
        - greetingInstruction
        - assistantDefaultLocale
        - proactiveGreetingEnabled
        - assistantBootstrapActive
        - websiteEmbedEnabled
        - websiteEmbedToken
