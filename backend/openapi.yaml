openapi: 3.1.0
info:
  title: radioso API
  version: 0.1.0
  description: Code-generated OpenAPI contract for the radioso backend
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
  - name: Auth
  - name: Account
  - name: Workspace
  - name: Assistant
  - name: History
  - name: Retrieval
  - name: Settings
  - name: Documents
  - name: Connectors
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: radioso_session
    workspaceSelection:
      type: apiKey
      in: header
      name: X-Workspace-Id
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
          required:
            - code
            - message
      required:
        - error
    FlatErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    RegisterResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        workspacePublicRouteKey:
          type: string
        requiresEmailVerification:
          type: boolean
          enum:
            - true
      required:
        - userId
        - accountId
        - organizationName
        - workspaceId
        - workspaceName
        - workspacePublicRouteKey
        - requiresEmailVerification
    LoginResponse:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        workspacePublicRouteKey:
          type: string
      required:
        - userId
        - accountId
        - organizationName
        - workspaceId
        - workspaceName
        - workspacePublicRouteKey
    AcceptedResponse:
      type: object
      properties:
        accepted:
          type: boolean
          enum:
            - true
      required:
        - accepted
    PasswordResetConfirmResponse:
      allOf:
        - $ref: "#/components/schemas/LoginResponse"
        - type: object
          properties:
            email:
              type: string
              format: email
          required:
            - email
    EmailVerificationVerifyResponse:
      type: object
      properties:
        verified:
          type: boolean
          enum:
            - true
      required:
        - verified
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        name:
          type: string
        publicRouteKey:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - accountId
        - name
        - publicRouteKey
        - createdAt
        - updatedAt
    WorkspaceRouteResolutionResponse:
      type: object
      properties:
        workspaceKey:
          type: string
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
      required:
        - workspaceKey
        - workspaceId
        - workspaceName
        - accountId
        - organizationName
    WorkspaceListResponse:
      type: object
      properties:
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
      required:
        - workspaces
    WorkspaceSummaryResponse:
      type: object
      properties:
        documentCount:
          type: integer
          minimum: 0
        readyDocumentCount:
          type: integer
          minimum: 0
        pendingDocumentCount:
          type: integer
          minimum: 0
        sampleDocumentCount:
          type: integer
          minimum: 0
        sampleDocumentSlugs:
          type: array
          items:
            type: string
        conversationCount:
          type: integer
          minimum: 0
        hasDocuments:
          type: boolean
        hasPendingDocuments:
          type: boolean
        hasReadyDocuments:
          type: boolean
        hasCompletedChat:
          type: boolean
        sampleDocumentsImported:
          type: boolean
        websiteCrawlerEnabled:
          type: boolean
      required:
        - documentCount
        - readyDocumentCount
        - pendingDocumentCount
        - sampleDocumentCount
        - sampleDocumentSlugs
        - conversationCount
        - hasDocuments
        - hasPendingDocuments
        - hasReadyDocuments
        - hasCompletedChat
        - sampleDocumentsImported
        - websiteCrawlerEnabled
    WorkspaceTokenResponse:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    WorkspaceMcpContextResponse:
      type: object
      properties:
        apiVersion:
          type: string
          enum:
            - 0.1.0
        mcpContextVersion:
          type: string
          enum:
            - 2026-05-06
        supportedTools:
          type: array
          items:
            type: string
            enum:
              - answer_grounded
              - create_document
              - delete_document
              - describe_capabilities
              - get_document
              - get_retrieval_settings
              - list_documents
              - reprocess_document
              - search_documents
              - update_document
              - update_retrieval_settings
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
          minLength: 1
      required:
        - apiVersion
        - mcpContextVersion
        - supportedTools
        - workspaceId
        - workspaceName
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        organizationName:
          type: string
          minLength: 1
          maxLength: 80
      required:
        - email
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        preferredWorkspaceId:
          type: string
          format: uuid
        preferredAccountId:
          type: string
          format: uuid
      required:
        - email
        - password
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
        preferredWorkspaceId:
          type: string
          format: uuid
        preferredAccountId:
          type: string
          format: uuid
      required:
        - token
        - password
    EmailVerificationVerifyRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
        - token
    EmailVerificationResendRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
    InvitationAcceptRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - email
        - password
    AccountInvitationCreateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - admin
            - member
          default: member
      required:
        - email
    AccountMembershipRoleUpdateRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - admin
            - member
      required:
        - role
    WorkspaceGrantRequest:
      type: object
      properties:
        role:
          type: string
          enum:
            - admin
            - member
      required:
        - role
    WorkspaceCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - name
    WorkspaceRenameRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - name
    AccountUser:
      type: object
      properties:
        membershipId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - owner
            - admin
            - member
        status:
          type: string
          enum:
            - active
        createdAt:
          type: string
          format: date-time
      required:
        - membershipId
        - userId
        - email
        - role
        - status
        - createdAt
    AccountInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        role:
          type: string
          enum:
            - admin
            - member
        expiresAt:
          type: string
          format: date-time
        acceptedAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - status
        - role
        - expiresAt
        - acceptedAt
        - createdAt
    WorkspaceGrant:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - admin
            - member
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - workspaceId
        - userId
        - role
        - createdAt
        - updatedAt
    AccountUsersResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        currentUserId:
          type: string
          format: uuid
        users:
          type: array
          items:
            $ref: "#/components/schemas/AccountUser"
        invitations:
          type: array
          items:
            $ref: "#/components/schemas/AccountInvitation"
        workspaceGrants:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceGrant"
      required:
        - accountId
        - currentUserId
        - users
        - invitations
        - workspaceGrants
    AccessibleAccount:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        organizationName:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - member
        workspaceId:
          type: string
          format: uuid
        workspaceName:
          type: string
        workspacePublicRouteKey:
          type: string
      required:
        - accountId
        - organizationName
        - role
        - workspaceId
        - workspaceName
        - workspacePublicRouteKey
    AccessibleAccountsResponse:
      type: object
      properties:
        currentAccountId:
          type: string
          format: uuid
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/AccessibleAccount"
      required:
        - currentAccountId
        - accounts
    CreateAccountInvitationResponse:
      allOf:
        - $ref: "#/components/schemas/AccountInvitation"
        - type: object
          properties:
            acceptanceUrl:
              type: string
          required:
            - acceptanceUrl
    InvitationDetailsResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        expiresAt:
          type: string
          format: date-time
      required:
        - accountId
        - email
        - status
        - expiresAt
    RetrievalSettings:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        queryRewriteEnabled:
          type: boolean
        semanticRewriteInstructions:
          type: string
          maxLength: 2000
        lexicalRewriteInstructions:
          type: string
          maxLength: 2000
        suggestedQuestionsEnabled:
          type: boolean
        rerankEnabled:
          type: boolean
        vectorTopK:
          type: integer
          minimum: 1
          maximum: 300
        similarityThreshold:
          type: number
          minimum: 0
          maximum: 1
        rerankTopK:
          type: integer
          minimum: 1
        citationDisplayEnabled:
          type: boolean
        metadataFieldSuggestions:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              inferredType:
                type: string
                enum: &a1
                  - string
                  - number
                  - date
                  - boolean
            required:
              - field
              - inferredType
          default: []
        metadataRules:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              field:
                type: string
              valueType:
                type: string
                enum: *a1
              operator:
                type: string
                enum: &a2
                  - equals
                  - not_equals
                  - contains
                  - not_contains
                  - lt
                  - lte
                  - gt
                  - gte
              value:
                type: string
              combinator:
                type: string
                enum:
                  - and
                  - or
                default: and
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    field:
                      type: string
                    valueType:
                      type: string
                      enum: *a1
                    operator:
                      type: string
                      enum: *a2
                    value:
                      type: string
                  required:
                    - id
                    - field
                    - valueType
                    - operator
                    - value
                default: []
              effect:
                type: string
                enum: &a3
                  - boost
                  - filter
              enabled:
                type: boolean
              triggerMode:
                type: string
                enum: &a4
                  - always_on
                  - match_turn
              triggerInstruction:
                type: string
            required:
              - id
              - field
              - valueType
              - operator
              - value
              - effect
              - enabled
              - triggerMode
          default: []
        customInstruction:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - workspaceId
        - queryRewriteEnabled
        - semanticRewriteInstructions
        - lexicalRewriteInstructions
        - suggestedQuestionsEnabled
        - rerankEnabled
        - vectorTopK
        - similarityThreshold
        - rerankTopK
        - citationDisplayEnabled
        - customInstruction
        - createdAt
        - updatedAt
    UpdateRetrievalSettingsRequest:
      type: object
      properties:
        queryRewriteEnabled:
          type: boolean
        semanticRewriteInstructions:
          type: string
          maxLength: 2000
        lexicalRewriteInstructions:
          type: string
          maxLength: 2000
        suggestedQuestionsEnabled:
          type: boolean
        rerankEnabled:
          type: boolean
        vectorTopK:
          type: integer
          minimum: 1
        similarityThreshold:
          type: number
        rerankTopK:
          type: integer
          maximum: 50
        citationDisplayEnabled:
          type: boolean
        metadataRules:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              field:
                type: string
                minLength: 1
              valueType:
                type: string
                enum: *a1
              operator:
                type: string
                enum: *a2
              value:
                type: string
              combinator:
                type: string
                enum: &a5
                  - and
                  - or
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                    field:
                      type: string
                      minLength: 1
                    valueType:
                      type: string
                      enum: *a1
                    operator:
                      type: string
                      enum: *a2
                    value:
                      type: string
                  required:
                    - id
                    - field
                    - valueType
                    - operator
                    - value
              effect:
                type: string
                enum: *a3
              enabled:
                type: boolean
              triggerMode:
                type: string
                enum: *a4
              triggerInstruction:
                type: string
                maxLength: 500
            required:
              - id
              - effect
              - enabled
        customInstruction:
          type: string
          maxLength: 2000
      required:
        - queryRewriteEnabled
        - rerankEnabled
        - vectorTopK
        - similarityThreshold
        - rerankTopK
        - citationDisplayEnabled
    RetrievalSettingsOverride:
      type: object
      properties:
        queryRewriteEnabled:
          type: boolean
        semanticRewriteInstructions:
          type: string
          maxLength: 2000
        lexicalRewriteInstructions:
          type: string
          maxLength: 2000
        suggestedQuestionsEnabled:
          type: boolean
        rerankEnabled:
          type: boolean
        vectorTopK:
          type: integer
          minimum: 1
        similarityThreshold:
          type: number
        rerankTopK:
          type: integer
          maximum: 50
        citationDisplayEnabled:
          type: boolean
        metadataRules:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              field:
                type: string
                minLength: 1
              valueType:
                type: string
                enum: *a1
              operator:
                type: string
                enum: *a2
              value:
                type: string
              combinator:
                type: string
                enum: *a5
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                    field:
                      type: string
                      minLength: 1
                    valueType:
                      type: string
                      enum: *a1
                    operator:
                      type: string
                      enum: *a2
                    value:
                      type: string
                  required:
                    - id
                    - field
                    - valueType
                    - operator
                    - value
              effect:
                type: string
                enum: *a3
              enabled:
                type: boolean
              triggerMode:
                type: string
                enum: *a4
              triggerInstruction:
                type: string
                maxLength: 500
            required:
              - id
              - effect
              - enabled
        customInstruction:
          type: string
          maxLength: 2000
    IngestionSettings:
      type: object
      properties:
        workspaceId:
          type: string
          format: uuid
        chunkingStrategy:
          type: string
          enum: &a7
            - fixed_window
            - structured_semantic
            - recursive_text
        embeddingModel:
          type: string
          enum: &a6
            - text-embedding-3-small
            - text-embedding-3-large
            - text-embedding-ada-002
            - gemini-embedding-001
        pendingEmbeddingModel:
          type:
            - string
            - "null"
          enum: *a6
        supportedEmbeddingModels:
          type: array
          items:
            type: string
            enum: *a6
        fixedWindowChunkSize:
          type: integer
        fixedWindowChunkOverlap:
          type: integer
        structuredMinChunkSize:
          type: integer
        structuredMaxChunkSize:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - workspaceId
        - chunkingStrategy
        - embeddingModel
        - pendingEmbeddingModel
        - supportedEmbeddingModels
        - fixedWindowChunkSize
        - fixedWindowChunkOverlap
        - structuredMinChunkSize
        - structuredMaxChunkSize
        - createdAt
        - updatedAt
    UpdateIngestionSettingsRequest:
      type: object
      properties:
        chunkingStrategy:
          type: string
          enum: *a7
        fixedWindowChunkSize:
          type: integer
          minimum: 100
          maximum: 4000
        fixedWindowChunkOverlap:
          type: integer
          minimum: 0
          maximum: 2000
        structuredMinChunkSize:
          type: integer
          minimum: 1
          maximum: 1000
        structuredMaxChunkSize:
          type: integer
          minimum: 1
          maximum: 2000
        embeddingModel:
          type: string
          enum: *a6
      required:
        - chunkingStrategy
        - fixedWindowChunkSize
        - fixedWindowChunkOverlap
        - structuredMinChunkSize
        - structuredMaxChunkSize
    RetrievalMetadataRule:
      type: object
      properties:
        id:
          type: string
        field:
          type: string
        valueType:
          type: string
          enum: *a1
        operator:
          type: string
          enum: *a2
        value:
          type: string
        combinator:
          type: string
          enum:
            - and
            - or
          default: and
        conditions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              field:
                type: string
              valueType:
                type: string
                enum: *a1
              operator:
                type: string
                enum: *a2
              value:
                type: string
            required:
              - id
              - field
              - valueType
              - operator
              - value
          default: []
        effect:
          type: string
          enum: *a3
        enabled:
          type: boolean
        triggerMode:
          type: string
          enum: *a4
        triggerInstruction:
          type: string
      required:
        - id
        - field
        - valueType
        - operator
        - value
        - effect
        - enabled
        - triggerMode
    TriggerAnalysisRule:
      type: object
      properties:
        ruleId:
          type: string
        matched:
          type: boolean
        matchStrength:
          type: number
          minimum: 0
          maximum: 1
        reason:
          type: string
        triggerInstructionPreview:
          type: string
      required:
        - ruleId
        - matched
        - matchStrength
        - reason
        - triggerInstructionPreview
    TriggerAnalysis:
      type: object
      properties:
        status:
          type: string
          enum:
            - skipped_not_configured
            - skipped_unavailable
            - applied
            - fallback
        consideredRules:
          type: array
          items:
            $ref: "#/components/schemas/TriggerAnalysisRule"
        matchedRuleIds:
          type: array
          items:
            type: string
        unmatchedRuleIds:
          type: array
          items:
            type: string
        matchCount:
          type: integer
          minimum: 0
        matcherVersion:
          type: string
        failureReason:
          type: string
      required:
        - status
        - consideredRules
        - matchedRuleIds
        - unmatchedRuleIds
        - matchCount
        - matcherVersion
    TriggerBackoff:
      type: object
      properties:
        applied:
          type: boolean
        reason:
          type: string
          enum:
            - empty_filtered_candidates
            - weak_filtered_support
        relaxedRuleIds:
          type: array
          items:
            type: string
        restoredCandidateCount:
          type: integer
          minimum: 0
      required:
        - applied
        - relaxedRuleIds
    UpdateGeneralSettingsRequest:
      type: object
      properties:
        anonymousChatEnabled:
          type: boolean
        assistantName:
          type: string
          maxLength: 200
        greetingInstruction:
          type: string
          maxLength: 200
        assistantDefaultLocale:
          type:
            - string
            - "null"
          maxLength: 35
        proactiveGreetingEnabled:
          type: boolean
        websiteEmbedEnabled:
          type: boolean
        websiteEmbedAllowedOrigins:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 20
        websiteEmbedLauncherLabel:
          type: string
          maxLength: 80
        websiteEmbedLauncherPosition:
          type: string
          enum: &a8
            - bottom-right
            - bottom-left
        websiteEmbedTheme:
          type: object
          properties:
            brand:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
            brandText:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
            surface:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
            text:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
        websiteEmbedCopy:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
              maxLength: 500
        websiteEmbedExpertOverrides:
          type: object
          additionalProperties:
            type: string
            maxLength: 500
    GeneralSettingsResponse:
      type: object
      properties:
        anonymousChatEnabled:
          type: boolean
        anonymousChatUrl:
          type:
            - string
            - "null"
        assistantName:
          type: string
        greetingInstruction:
          type: string
        assistantDefaultLocale:
          type:
            - string
            - "null"
        proactiveGreetingEnabled:
          type: boolean
        assistantBootstrapActive:
          type: boolean
        assistantLogoUrl:
          type:
            - string
