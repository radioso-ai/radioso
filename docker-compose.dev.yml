services:
  backend:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages
      - radioso_backend_node_modules:/app/backend/node_modules
    command: ["backend-dev-entrypoint.sh", "dev:http"]

  backend-worker:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages
      - radioso_backend_node_modules:/app/backend/node_modules
    command: ["backend-dev-entrypoint.sh", "dev:worker"]

  backend-crawler-worker:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./packages:/app/packages
      - radioso_backend_node_modules:/app/backend/node_modules
    command: ["backend-dev-entrypoint.sh", "dev:crawler-worker"]

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.dev.Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: development
      BACKEND_INTERNAL_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - radioso_frontend_node_modules:/app/node_modules

volumes:
  radioso_backend_node_modules:
  radioso_frontend_node_modules:
