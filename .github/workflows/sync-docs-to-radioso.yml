name: Sync Docs to Radioso

# Imports the documentation portal into the production self-docs workspace so an
# agent can answer questions about Radioso. Idempotent: unchanged pages are
# skipped by content hash; --prune removes only previously imported docs.

on:
  push:
    branches:
      - main
    paths:
      - docs-portal/content/**
      - backend/openapi.json
      - packages/radioso-docs-importer/**
      - .github/workflows/sync-docs-to-radioso.yml
      # READMEs are imported as product surface, so changes to any of them re-sync.
      - "**/README.md"
      - "**/readme.md"
  workflow_dispatch:
    inputs:
      prune:
        description: Delete imported docs that are no longer present
        type: boolean
        default: true

jobs:
  sync:
    name: Import docs into Radioso
    runs-on: ubuntu-latest
    environment: live
    concurrency:
      group: sync-docs-to-radioso
      cancel-in-progress: false
    env:
      RADIOSO_BASE_URL: https://app.radioso.ai/backend
      RADIOSO_API_TOKEN: ${{ secrets.RADIOSO_DOCS_API_TOKEN }}
      CITATION_BASE_URL: https://docs.radioso.ai
      REPO_SOURCE_BASE_URL: https://github.com/radioso-ai/radioso/blob/main

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install docs importer dependencies
        run: pnpm install --frozen-lockfile --filter @radioso/docs-importer...

      - name: Import docs into Radioso
        run: |
          if [ -z "${RADIOSO_API_TOKEN}" ]; then
            echo "::notice::Skipping docs import because RADIOSO_DOCS_API_TOKEN is not configured."
            exit 0
          fi
          PRUNE_FLAG="--prune"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prune }}" != "true" ]; then
            PRUNE_FLAG=""
          fi
          pnpm --filter @radioso/docs-importer run import -- $PRUNE_FLAG
