name: Conversation Quality Evals

# Runs the live conversation-quality suite (real model + retrieval + routines) against a
# throwaway workspace and gates on regressions vs the committed baseline. This is NOT a
# per-PR gate: it needs provider credentials, spends tokens, and is nondeterministic, so
# it runs nightly (and on demand). The deterministic harness logic is covered separately
# by tests/unit/eval-suite in the normal CI job. A second step runs the voice cases the
# same way, through the voice runtime's door.
#
# Requires the OPENAI_API_KEY secret on the `staging` environment, which the job names below. Sampling (--samples 5) matches how the
# baseline is recorded, so run-to-run LLM variance does not produce false regressions.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      samples:
        description: Samples per case (higher = more stable, more tokens)
        required: false
        default: "5"
      record_voice_baseline:
        description: Re-record voice-baseline.json from this run's voice cases and upload it as an artifact to commit
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: conversation-quality-evals
  cancel-in-progress: true

jobs:
  evals:
    name: Conversation-quality suite
    # `OPENAI_API_KEY` is an environment secret, not a repository one, so the job has to name
    # the environment to see it. Without this `secrets.OPENAI_API_KEY` resolves empty and the
    # guard below fails the run. `staging` carries no protection rules or branch policy, so a
    # scheduled run never waits on an approval.
    environment: staging
    runs-on: ubuntu-latest
    # The text suite alone takes about 15 minutes; the voice cases follow it.
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16
        env:
          POSTGRES_DB: radioso_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d radioso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile --filter radioso-backend... --filter @radioso/crawler...

      - name: Build workspace packages
        working-directory: backend
        run: pnpm run build:workspace-deps

      - name: Prepare eval environment file
        id: env
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY secret is not set; the live eval suite cannot run." >&2
            exit 1
          fi
          cp ../.env.example ./.env.evals
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/radioso_test|" ./.env.evals
          sed -i "s|^OPENAI_API_KEY=.*|OPENAI_API_KEY=${OPENAI_API_KEY}|" ./.env.evals
          # Deterministic dummy signing secrets — the workspace is throwaway and never exposed.
          # The connector key must be base64 of exactly 32 bytes or getEnv() rejects the file.
          sed -i "s|^SESSION_COOKIE_SECRET=.*|SESSION_COOKIE_SECRET=ci-session-secret-000000000000000000000000000000|" ./.env.evals
          sed -i "s|^WORKSPACE_TOKEN_SECRET=.*|WORKSPACE_TOKEN_SECRET=ci-workspace-token-secret-0000000000000000000000|" ./.env.evals
          sed -i "s|^PUBLIC_CHAT_SESSION_SECRET=.*|PUBLIC_CHAT_SESSION_SECRET=ci-public-chat-secret-00000000000000000000000000|" ./.env.evals
          sed -i "s|^CONNECTOR_ENCRYPTION_KEY=.*|CONNECTOR_ENCRYPTION_KEY=cmFkaW9zby1jaS1ldmFsLWtleS0wMDAwMDAwMDAwMDA=|" ./.env.evals

      - name: Apply migrations
        id: migrate
        working-directory: backend
        run: node --env-file=./.env.evals --import tsx ./scripts/migrate.ts

      - name: Start document worker
        id: worker
        working-directory: backend
        run: |
          node --env-file=./.env.evals --import tsx ./src/documentWorker.ts &
          echo "WORKER_PID=$!" >> "$GITHUB_ENV"

      - name: Run conversation-quality suite
        working-directory: backend
        # `--judge-tag quick-reply` grades the quick-reply cases' "no factual proposition" judge
        # assertions on the configuration's rerank-tier model; every other case scores its
        # deterministic layer.
        run: node --env-file=./.env.evals --import tsx ./scripts/runEvals.ts --samples ${{ github.event.inputs.samples || '5' }} --judge-tag quick-reply

      - name: Run voice cases
        working-directory: backend
        # The voice cases through the served app's completions door (generic dialect), gated on the
        # wire against voice-baseline.json; latency is reported, never gated. Three samples a night,
        # or the dispatch's `samples`. It runs whenever the environment, the migrations and the
        # worker are up, so a night whose text suite regressed still reports the voice cases.
        if: ${{ !cancelled() && steps.env.outcome == 'success' && steps.migrate.outcome == 'success' && steps.worker.outcome == 'success' }}
        run: |
          set -euo pipefail
          args=(./scripts/runEvals.ts --channel voice --samples "${{ github.event.inputs.samples || '3' }}")
          if [ "${{ github.event.inputs.record_voice_baseline }}" = "true" ]; then
            args+=(--update-baseline)
          fi
          node --env-file=./.env.evals --import tsx "${args[@]}"

      # The voice latency baseline is the nightly runner's, not a laptop's: recording happens here,
      # and the file comes back out to be committed.
      - name: Upload recorded voice baseline
        if: ${{ github.event.inputs.record_voice_baseline == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: voice-eval-baseline
          path: backend/tests/fixtures/conversation-quality/voice-baseline.json
          if-no-files-found: error

      - name: Stop document worker
        if: always()
        run: kill "${WORKER_PID}" 2>/dev/null || true
