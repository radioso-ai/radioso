services:
  workspace-deps:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    restart: "no"
    volumes:
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./packages:/app/packages
      - radioso_workspace_node_modules:/app/node_modules
      - radioso_backend_node_modules:/app/backend/node_modules
      - radioso_frontend_node_modules:/app/frontend/node_modules
      - radioso_crawler_node_modules:/app/packages/crawler/node_modules
      - radioso_document_parser_node_modules:/app/packages/document-parser/node_modules
      - radioso_ui_node_modules:/app/packages/ui/node_modules
      - radioso_pnpm_store:/pnpm/store
    command: ["sh", "-lc", "pnpm install --force --frozen-lockfile && backend-dev-install-state.sh write"]

  backend:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    environment:
      NODE_ENV: development
      AUTH_AUTO_VERIFY_EMAIL: "true"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      workspace-deps:
        condition: service_completed_successfully
    volumes:
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./backend:/app/backend
      - ./packages:/app/packages
      - radioso_workspace_node_modules:/app/node_modules
      - radioso_backend_node_modules:/app/backend/node_modules
      - radioso_crawler_node_modules:/app/packages/crawler/node_modules
      - radioso_document_parser_node_modules:/app/packages/document-parser/node_modules
      - radioso_pnpm_store:/pnpm/store
    command: ["backend-dev-entrypoint.sh", "dev:http"]

  backend-worker:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./backend:/app/backend
      - ./packages:/app/packages
      - radioso_workspace_node_modules:/app/node_modules
      - radioso_backend_node_modules:/app/backend/node_modules
      - radioso_crawler_node_modules:/app/packages/crawler/node_modules
      - radioso_document_parser_node_modules:/app/packages/document-parser/node_modules
      - radioso_pnpm_store:/pnpm/store
    command: ["backend-dev-entrypoint.sh", "dev:worker"]

  backend-crawler-worker:
    build:
      context: .
      dockerfile: infra/backend.dev.Dockerfile
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./backend:/app/backend
      - ./packages:/app/packages
      - radioso_workspace_node_modules:/app/node_modules
      - radioso_backend_node_modules:/app/backend/node_modules
      - radioso_crawler_node_modules:/app/packages/crawler/node_modules
      - radioso_document_parser_node_modules:/app/packages/document-parser/node_modules
      - radioso_pnpm_store:/pnpm/store
    command: ["backend-dev-entrypoint.sh", "dev:crawler-worker"]

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.dev.Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: development
      BACKEND_INTERNAL_URL: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./frontend:/app/frontend
      - ./packages:/app/packages
      - radioso_workspace_node_modules:/app/node_modules
      - radioso_frontend_node_modules:/app/frontend/node_modules
      - radioso_ui_node_modules:/app/packages/ui/node_modules
      - radioso_frontend_next:/app/frontend/.next
      - radioso_pnpm_store:/pnpm/store

volumes:
  radioso_workspace_node_modules:
  radioso_backend_node_modules:
  radioso_crawler_node_modules:
  radioso_document_parser_node_modules:
  radioso_frontend_node_modules:
  radioso_ui_node_modules:
  radioso_frontend_next:
  # Persists the pnpm content-addressable store across boots so the runtime
  # dependency reinstall does not re-download packages on every `run-dev.sh`.
  radioso_pnpm_store:
