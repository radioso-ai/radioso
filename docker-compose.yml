name: ${COMPOSE_PROJECT_NAME:-radioso}

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16
    shm_size: "1gb"
    environment:
      POSTGRES_DB: radioso
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${RADIOSO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - radioso_postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d radioso"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  backend:
    pull_policy: build
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/radioso
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PUBLIC_CHAT_BASE_URL: ${PUBLIC_CHAT_BASE_URL:-http://localhost:3000/chat}
      SESSION_TTL_HOURS: 168
    volumes:
      - radioso_document_storage:/app/.context/document-storage
    command: ["node", "./dist/src/httpServer.js"]
    ports:
      - "${RADIOSO_BACKEND_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:8080/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend-worker:
    pull_policy: build
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/radioso
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PUBLIC_CHAT_BASE_URL: ${PUBLIC_CHAT_BASE_URL:-http://localhost:3000/chat}
      SESSION_TTL_HOURS: 168
    volumes:
      - radioso_document_storage:/app/.context/document-storage
    command: ["node", "./dist/src/documentWorker.js"]

  backend-crawler-worker:
    pull_policy: build
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/radioso
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      PUBLIC_CHAT_BASE_URL: ${PUBLIC_CHAT_BASE_URL:-http://localhost:3000/chat}
      SESSION_TTL_HOURS: 168
    volumes:
      - radioso_document_storage:/app/.context/document-storage
    command: ["node", "./dist/src/crawlerWorker.js"]

  frontend:
    pull_policy: build
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "${RADIOSO_FRONTEND_PORT:-3000}:3000"

volumes:
  radioso_postgres_data:
  radioso_document_storage:
